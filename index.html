// ---- helpers ---------------------------------------------------------------
function rngFor(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rgb = a => `rgb(${a[0] | 0},${a[1] | 0},${a[2] | 0})`;
const rgba = (a, al) => `rgba(${a[0] | 0},${a[1] | 0},${a[2] | 0},${al})`;
const hex2 = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
let FOG = STAGES[0].fog;
function mix(c, k, fog) {
  const r = Math.min(255, c[0] * k), g = Math.min(255, c[1] * k), b = Math.min(255, c[2] * k);
  return `rgb(${(r + (FOG[0] - r) * fog) | 0},${(g + (FOG[1] - g) * fog) | 0},${(b + (FOG[2] - b) * fog) | 0})`;
}
function pick(r, keys, weights) {
  let x = r();
  for (let i = 0; i < keys.length; i++) { x -= weights[i]; if (x <= 0) return keys[i]; }
  return keys[keys.length - 1];
}
function shuffle(arr, r = Math.random) {
  for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; }
  return arr;
}

// which planet a player is on for stage i (chosen by route portals)
function stageIdx(p, i) {
  if (p.route[i] === undefined) p.route[i] = Math.floor(rngFor(p.seed + i * 31)() * STAGES.length);
  return p.route[i];
}
function palette(p, z) {
  const i = Math.max(0, Math.floor(z / STAGE_LEN));
  const into = z - i * STAGE_LEN;
  const cur = STAGES[stageIdx(p, i)], prev = i > 0 ? STAGES[stageIdx(p, i - 1)] : cur;
  const b = i === 0 ? 1 : clamp(into / 60, 0, 1);
  const L = key => prev[key].map((v, k) => v + (cur[key][k] - v) * b);
  return { i, cur, prev, b, prog: into / STAGE_LEN, fog: L('fog'), sky: L('sky'), track: L('track'), neon: L('neon'), deco: L('deco') };
}

// ---- audio: sound effects, voice, music ------------------------------------
let actx = null, muted = false, lastSpeak = 0;
function audioInit() {
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
  } catch (e) { actx = null; }
}
function tone(freq, dur, type = 'sine', gain = 0.05, slide = 0, delay = 0) {
  if (!actx || muted) return;
  try {
    const t = actx.currentTime + delay;
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq * slide), t + dur);
    g.gain.setValueAtTime(gain, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(actx.destination);
    o.start(t); o.stop(t + dur + 0.02);
  } catch (e) {}
}
function noise(dur, gain) {
  if (!actx || muted) return;
  try {
    const n = Math.floor(actx.sampleRate * dur);
    const buf = actx.createBuffer(1, n, actx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n) ** 2;
    const src = actx.createBufferSource(), f = actx.createBiquadFilter(), g = actx.createGain();
    src.buffer = buf; f.type = 'lowpass'; f.frequency.value = 900; g.gain.value = gain;
    src.connect(f).connect(g).connect(actx.destination);
    src.start();
  } catch (e) {}
}
const SFX = {
  shoot: () => tone(1400, 0.04, 'square', 0.005, 0.35),
  coin: () => { tone(990, 0.06, 'square', 0.022); tone(1480, 0.09, 'square', 0.022, 0, 0.05); },
  boom: () => noise(0.35, 0.22),
  bigboom: () => { noise(0.7, 0.35); tone(90, 0.5, 'sine', 0.18, 0.4); },
  hurt: () => tone(220, 0.35, 'sawtooth', 0.08, 0.35),
  power: () => [523, 659, 784, 1046].forEach((f, i) => tone(f, 0.12, 'triangle', 0.06, 0, i * 0.06)),
  tung: () => [0, 0.14, 0.28].forEach(d => tone(170, 0.1, 'triangle', 0.16, 0.6, d)),
  hit: () => tone(300, 0.05, 'triangle', 0.02, 0.5),
  click: () => tone(660, 0.05, 'triangle', 0.05),
};
function speak(txt, force) {
  if (muted || !window.speechSynthesis) return;
  const now = performance.now();
  if (!force && now - lastSpeak < 4000) return;
  lastSpeak = now;
  try {
    const u = new SpeechSynthesisUtterance(txt);
    u.lang = 'it-IT'; u.rate = 1.08; u.pitch = 0.7 + Math.random() * 0.9; u.volume = 0.9;
    speechSynthesis.cancel();
    speechSynthesis.speak(u);
  } catch (e) {}
}

// Upbeat eurodance loop (C major: C-G-Am-F), synthesized live: four-on-the-floor kick
// with sidechain pumping, rolling offbeat bass, 16th arps, piano stabs and a supersaw hook.
// It changes key with the planet and speeds up with the run; the menu plays it muffled.
const Music = { on: false, step: 0, next: 0, bpm: 128, key: 0, master: null, bus: null, filt: null, noise: null, cut: 0 };
const CHORDS = [[60, 64, 67], [59, 62, 67], [57, 60, 64], [57, 60, 65]];
const ROOTS = [36, 43, 45, 41];
const HOOK = [
  [72, 0, 72, 0, 76, 0, 79, 0, 79, 0, 76, 0, 77, 76, 74, 0],
  [74, 0, 74, 0, 79, 0, 83, 0, 81, 0, 79, 0, 77, 0, 74, 0],
  [76, 0, 76, 0, 72, 0, 76, 0, 79, 0, 81, 0, 79, 77, 76, 0],
  [77, 0, 77, 0, 76, 0, 74, 0, 72, 0, 74, 0, 76, 0, 0, 0],
  [84, 0, 84, 0, 83, 0, 79, 0, 76, 0, 79, 0, 84, 0, 86, 0],
  [86, 0, 83, 0, 79, 0, 83, 0, 86, 0, 88, 0, 86, 0, 83, 0],
  [81, 0, 84, 0, 88, 0, 84, 0, 81, 0, 79, 0, 76, 0, 79, 0],
  [77, 0, 81, 0, 84, 0, 81, 0, 79, 0, 77, 0, 76, 74, 72, 0],
];
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
function musicStart() {
  if (!actx) return;
  try {
    if (!Music.master) {
      const comp = actx.createDynamicsCompressor();
      comp.threshold.value = -14; comp.ratio.value = 4;
      Music.master = actx.createGain(); Music.master.gain.value = 0.5;
      Music.master.connect(comp).connect(actx.destination);
      Music.filt = actx.createBiquadFilter(); Music.filt.type = 'lowpass'; Music.filt.frequency.value = 1400; Music.filt.Q.value = 0.8;
      Music.bus = actx.createGain();
      Music.bus.connect(Music.filt).connect(Music.master);
      const n = actx.sampleRate, b = actx.createBuffer(1, n, n), d = b.getChannelData(0);
      for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
      Music.noise = b;
    }
    if (!Music.on) { Music.on = true; Music.next = actx.currentTime + 0.06; Music.step = 0; }
  } catch (e) {}
}
function env(g, t, a, peak, dur) {
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(peak, t + a);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
}
function mOsc(t, m, dur, type, v, cut, det = 0) {
  const o = actx.createOscillator(), g = actx.createGain(), f = actx.createBiquadFilter();
  o.type = type; o.frequency.setValueAtTime(mtof(m), t); o.detune.value = det;
  f.type = 'lowpass'; f.frequency.setValueAtTime(cut, t);
  env(g, t, 0.004, v, dur);
  o.connect(f).connect(g).connect(Music.bus);
  o.start(t); o.stop(t + dur + 0.05);
}
function mNoise(t, dur, type, freq, v, toBus = true) {
  const s = actx.createBufferSource(), f = actx.createBiquadFilter(), g = actx.createGain();
  s.buffer = Music.noise; f.type = type; f.frequency.value = freq;
  env(g, t, 0.002, v, dur);
  s.connect(f).connect(g).connect(toBus ? Music.bus : Music.master);
  s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.02);
}
function mKick(t, v = 1) {
  const o = actx.createOscillator(), g = actx.createGain();
  o.frequency.setValueAtTime(160, t); o.frequency.exponentialRampToValueAtTime(45, t + 0.1);
  env(g, t, 0.002, 0.95 * v, 0.22);
  o.connect(g).connect(Music.master);
  o.start(t); o.stop(t + 0.26);
  // sidechain pump: duck everything else under the kick
  Music.bus.gain.setValueAtTime(0.3, t);
  Music.bus.gain.linearRampToValueAtTime(1, t + 0.14);
}
function musicStep(s, t, spb) {
  const bar = Math.floor(s / 16) % 8, st = s % 16, ch = bar % 4, tr = Music.key;
  const full = state === 'play' || state === 'countdown' || state === 'upgrade';
  const c = CHORDS[ch];
  if (st % 4 === 0 && (full || st % 8 === 0)) mKick(t, full ? 1 : 0.55);
  if (full) {
    if (st === 4 || st === 12) { mNoise(t, 0.15, 'bandpass', 1500, 0.3); mNoise(t + 0.01, 0.1, 'bandpass', 2200, 0.18); }
    if (st % 4 === 2) mNoise(t, 0.11, 'highpass', 7000, 0.13);
    else if (st % 2 === 1) mNoise(t, 0.025, 'highpass', 9500, 0.05);
    if (bar === 7 && st >= 8) mNoise(t, 0.07, 'bandpass', 1800, 0.06 + (st - 8) * 0.025);   // snare roll
    if (bar === 0 && st === 0) mNoise(t, 1.4, 'highpass', 5000, 0.12, false);              // crash
    if (st % 4 === 2) c.forEach(m => mOsc(t, m + 12 + tr, spb * 1.1, 'triangle', 0.045, 4500)); // piano stab
  } else if (st % 4 === 2) mNoise(t, 0.05, 'highpass', 8000, 0.05);
  if (st % 4 !== 0) mOsc(t, ROOTS[ch] + tr + (st % 4 === 2 ? 12 : 0), spb * 0.85, 'sawtooth', 0.22, full ? 1300 : 700);
  mOsc(t, c[st % 3] + 12 + tr + ((st >> 2) % 2) * 12, spb * 0.8, 'square', full ? 0.028 : 0.02, 3200);
  const nt = HOOK[bar][st];
  if (nt) for (const det of [-14, 0, 14]) mOsc(t, nt + tr, spb * 1.7, 'sawtooth', (full ? 0.06 : 0.045) * 0.5, 5200, det);
}
setInterval(() => {
  if (!actx || !Music.on) return;
  try {
    if (Music.next < actx.currentTime - 0.5) Music.next = actx.currentTime + 0.05;
    const ahead = actx.currentTime + 0.15;
    while (Music.next < ahead) {
      const spb = 60 / Music.bpm / 4;
      if (!muted) musicStep(Music.step, Music.next, spb);
      Music.next += spb; Music.step++;
    }
  } catch (e) {}
}, 25);
function musicUpdate() {
  let cut;
  if (state === 'play' || state === 'countdown') {
    const p = active[0];
    Music.key = STAGES[stageIdx(p, Math.floor(p.z / STAGE_LEN))].k;
    Music.bpm = 140 + (speed - START_SPEED) * 1.4;
    cut = 16000;
  } else if (state === 'upgrade') cut = 2400;
  else { Music.key = 0; Music.bpm = 128; cut = 1400; }
  if (Music.filt && cut !== Music.cut) { Music.cut = cut; try { Music.filt.frequency.setTargetAtTime(cut, actx.currentTime, 0.25); } catch (e) {} }
}

// ---- world generation (each player has their own world) ---------------------
function makeObs(type, lane, z, id) {
  switch (type) {
    case 'freighter': return { type, lane, z, len: 7, y0: 0, h: 2.7, id, solid: true };
    case 'rock':      return { type, lane, z, len: 0.6, y0: 0, h: 1.0, id, hpMax: 3, breakable: true };
    case 'crate':     return { type, lane, z, len: 1.0, y0: 0, h: 1.1, id, hpMax: 2, breakable: true };
    case 'bomb':      return { type, lane, z, len: 0.8, y0: 0, h: 0.9, id, hpMax: 1, breakable: true, t0: clock };
    default:          return { type: 'laser', lane, z, len: 0.3, y0: 1.15, h: 1.2, id };
  }
}

function gateOptions(p, si) {
  if (p.gateOpts[si]) return p.gateOpts[si];
  const r = rngFor(p.seed * 7 + si * 131);
  const cur = stageIdx(p, si);
  const planets = shuffle([...STAGES.keys()].filter(k => k !== cur), r);
  const mods = shuffle(['hard', 'gold', 'chill'], r);
  return (p.gateOpts[si] = [0, 1, 2].map(k => ({ planet: planets[k], mod: mods[k] })));
}

function getChunk(p, i) {
  let ch = p.chunks.get(i);
  if (ch) return ch;
  const r = rngFor(p.seed * 100003 + i * 7919);
  const si = Math.floor(i / STAGE_CHUNKS), li = i % STAGE_CHUNKS, mod = p.mods[si] || null;
  const obs = [], coins = [], cres = [], pows = [], gates = [];
  let n = 0;
  if (i > 0) {
    let busy = Math.min(0.88, 0.42 + i * 0.022);
    if (isBossStage(si)) busy *= 0.5;   // keep the track readable during boss fights
    if (mod === 'hard') busy += 0.08;
    if (mod === 'chill') busy -= 0.15;
    const fr = mod === 'gold' ? 0.42 : 0.28;
    const rows = [];
    for (let row = 0; row < 3; row++) {
      if (li === 0 && si > 0 && row === 0) continue;          // breathing room after a portal
      if (li === STAGE_CHUNKS - 1 && row > 0) continue;       // clear run-up to the portals
      const z = i * CHUNK + 4 + row * 20 + r() * 4;
      const free = Math.floor(r() * 3) - 1;
      rows.push([z, free]);
      for (let lane = -1; lane <= 1; lane++) {
        if (lane === free || r() > busy) continue;
        const pp = r();
        const type = pp < fr ? 'freighter' : pp < fr + 0.26 ? 'rock' : pp < fr + 0.44 ? 'laser' : 'crate';
        obs.push(makeObs(type, lane, z, `${i}o${n++}`));
        if ((type === 'rock' || type === 'crate') && r() < (mod === 'gold' ? 0.9 : 0.5))
          for (let c = 0; c < 3; c++) coins.push({ lane, z: z - 1.6 + c * 1.6, y: 2.1, id: `${i}k${n++}` });
      }
      if (r() < (mod === 'gold' ? 1 : 0.7))
        for (let c = 0; c < 5; c++) coins.push({ lane: free, z: z - 13 + c * 1.6, y: 0.9, id: `${i}k${n++}` });
    }
    if (i >= 2 && li < STAGE_CHUNKS - 1) {
      let count = (r() < 0.7 ? 1 : 0) + (r() < Math.min(0.6, i * 0.03) ? 1 : 0) + (r() < Math.min(0.55, (i - 10) * 0.03) ? 1 : 0);
      if (isBossStage(si)) count = 0;
      if (mod === 'hard') count += 1;
      if (mod === 'chill') count = Math.max(0, count - 1);
      for (let k = 0; k < count; k++)
        cres.push({ cre: true, kind: pick(r, KIND_KEYS, KIND_W), lane: Math.floor(r() * 3) - 1, z0: i * CHUNK + 10 + r() * 45, id: `${i}c${k}`, si });
    }
    if (rows.length > 1 && r() < (mod === 'chill' ? 0.65 : 0.4)) {
      const [z, free] = rows[1];
      pows.push({ kind: pick(r, POWER_KEYS, POWER_KEYS.map(k => POWERS[k].w)), lane: free, z: z - 3, y: 1.1, id: `${i}p` });
    }
    if (li === STAGE_CHUNKS - 1) {
      const gz = (si + 1) * STAGE_LEN - 14;
      gateOptions(p, si).forEach((o, k) => gates.push({ lane: k - 1, z: gz, planet: o.planet, mod: o.mod }));
      for (let c = 0; c < 6; c++) coins.push({ lane: 0, z: gz - 26 + c * 1.6, y: 0.9, id: `${i}k${n++}` });
    }
  }
  const deco = [];
  for (const side of [-1, 1]) {
    for (let k = 0; k < 5; k++) {
      const kind = pick(r, DECO_KINDS, DECO_W);
      const s = kind === 'island' ? 2 + r() * 2.5 : kind === 'bubble' ? 0.8 + r() * 1.6 : 1.4 + r() * 2.2;
      const verts = []; for (let v = 0; v < 9; v++) verts.push(0.75 + r() * 0.35);
      const shards = []; for (let v = 0; v < 5; v++) shards.push(0.9 + r() * 1.4);
      deco.push({ kind, s, x: side * (5.8 + s + r() * 9), y: kind === 'mushroom' || kind === 'crystal' ? -1.5 + r() * 4 : -1 + r() * 9,
        z: i * CHUNK + k * 12 + r() * 10, verts, shards, spin: (r() - 0.5) * 1.5, ph: r() * 10, hue: r() < 0.5 ? 0 : 1 });
    }
  }
  ch = { obs, coins, cres, pows, deco, gates };
  p.chunks.set(i, ch);
  return ch;
}

function chunksIn(p, z0, z1) {
  const out = [];
  for (let i = Math.max(0, Math.floor(z0 / CHUNK)); i <= Math.floor(z1 / CHUNK); i++) out.push(getChunk(p, i));
  return out;
}

// creatures walk toward the runner once it gets within 70 units
function crePos(c, p) {
  const K = KINDS[c.kind];
  const km = 1 + 0.07 * (c.si ?? p.stage);   // brainrots get faster on later planets
  const z = c.z0 - K.k * km * Math.max(0, p.z - (c.z0 - 70)) - (c.charge || 0);
  let x = c.cx ?? c.lane * LANE_W;
  if (c.kind === 'ballerina') x += Math.sin(clock * 2.5 + c.z0) * 0.45;
  return [x, z];
}

const attackCost = p => Math.max(4, COINS_PER_ATTACK - 3 * (p.up.saboteur || 0));

function attack(from, to) {

function gather(p) {
  const T = [];
  const add = o => {
    if (p.dead.has(o.id)) return;
    if (o.cre) {
      const [x, z] = crePos(o, p), K = KINDS[o.kind];

    } else {

}

function applyPower(p, kind) {

  else if (kind === 'magnet') p.magnet = 10;

}

function destroy(p, t, byGun) {

    p.special = Math.min(100, p.special + 10);
    p.combo = p.comboT > 0 ? p.combo + 1 : 1;
    p.comboT = 2.5 + (p.up.combo || 0);
    p.bestCombo = Math.max(p.bestCombo, p.combo);
    const modMult = p.mods[Math.floor(p.z / STAGE_LEN)] === 'hard' ? 1.5 : 1;
    const comboMult = p.combo * (p.combo >= 2 ? 1 + 0.5 * (p.up.combo || 0) : 1);
    const pts = Math.round(K.pts * comboMult * modMult);
    p.points += pts;
    float(p, t.x, K.h * CRE_S, cz, `+${pts}`, '#ffe14d');
    if (p.combo >= 3) say(p, `🔥 COMBO x${p.combo}! ${SHOUTS[Math.floor(Math.random() * SHOUTS.length)]}`, '#ffd23f');

    if (o && p.up.thief && o.coins > 0) { o.coins--; o.meter = Math.max(0, o.meter - 1); addCoins(p, 1); float(p, t.x, K.h * CRE_S + 0.8, cz, '+1 🦝', '#ffe14d'); }

    float(p, t.x, 1.4, cz, '+10', '#ddd');
    SFX.boom();
  }
}

function updateBoss(p, dt) {
  const B = p.boss;
  B.t += dt; B.moveT -= dt; B.nextShot -= dt; B.throwT -= dt;
  if (B.moveT <= 0) {
    B.lane = Math.random() < 0.5 ? p.lane : Math.floor(Math.random() * 3) - 1;
    B.moveT = Math.max(0.7, 1.6 - 0.2 * B.lvl) + Math.random();
  }
  B.x += clamp(B.lane * LANE_W - B.x, -5 * dt, 5 * dt);
  if (B.nextShot <= 0) {   // throws junk at your lane (sometimes two lanes)
    B.nextShot = Math.max(0.55, 1.35 - 0.15 * B.lvl - B.t * 0.012);
    B.throwT = 0.3;
    const lanes = [p.lane];

  }

function updateEvents(p, dt) {
  const si = Math.floor(p.z / STAGE_LEN), into = p.z - si * STAGE_LEN;

    return;
  }
  if (si >= 1 && !p.eventDone[si] && into > 140) {
    p.eventDone[si] = true;
    const type = ['meteor', 'stampede', 'lasers'][Math.floor(Math.random() * 3)];
    p.event = { type, n: 0, t: 0 };
    say(p, { meteor: '☄️ METEOR SHOWER!', stampede: '🐾 BRAINROT STAMPEDE!', lasers: '⚡ LASER GAUNTLET!' }[type], '#ff9a5a');
  }
  const E = p.event;
  if (!E) return;
  E.t -= dt;
  if (E.t > 0) return;
  if (E.type === 'meteor') {        // rocks fall onto your lane
    const o = makeObs('rock', Math.random() < 0.6 ? p.lane : Math.floor(Math.random() * 3) - 1, p.z + 38, 'm' + spawnN++);
    o.t0 = clock; p.extra.push(o);
    E.t = Math.max(0.45, 0.8 - 0.05 * si); if (++E.n >= 6 + si) p.event = null;
  } else if (E.type === 'stampede') {
    for (const l of [-1, 0, 1]) if (Math.random() < 0.7) p.extra.push({ cre: true, kind: KIND_KEYS[Math.floor(Math.random() * KIND_KEYS.length)], lane: l, z0: p.z + 85, id: 'e' + spawnN++, si });
    E.t = 1.4; if (++E.n >= 3) p.event = null;
  } else {                          // two lanes of lasers, one free lane that keeps moving
    const free = Math.floor(Math.random() * 3) - 1;
    for (const l of [-1, 0, 1]) if (l !== free) p.extra.push(makeObs('laser', l, p.z + 60, 'l' + spawnN++));
    E.t = 1.1; if (++E.n >= 4) p.event = null;
  }
}

function applyGate(p, si, g) {
  p.gateDone[si] = true;
  p.route[si + 1] = g.planet;
  p.mods[si + 1] = g.mod;
  for (const k of [...p.chunks.keys()]) if (k >= (si + 1) * STAGE_CHUNKS) p.chunks.delete(k);
  p.gatesTaken.push(g.mod);
  if (g.mod === 'chill') p.hearts = Math.min(p.maxHearts, p.hearts + 1);
  const M = MODS[g.mod];
  say(p, `${M.icon} ${M.name} → ${STAGES[g.planet].name}`, M.col);
  burst(p, p.x, 1.2, p.z + 2, hex2(M.col), 30, 10);
  SFX.power();
  p.pick = makePick(p);
}

function makePick(p) {
  const pool = shuffle(Object.keys(UPGRADES).filter(k => {
    const U = UPGRADES[k];
    if (U.duel && mode !== 'duel') return false;
    if (U.solo && mode !== 'solo') return false;
    return (p.up[k] || 0) < U.max;
  }));
  if (!pool.length) return null;
  return { opts: pool.slice(0, 3), sel: Math.min(1, pool.length - 1), done: false };
}
function upgradeInput(p, action) {
  const pk = p.pick;
  if (!pk || pk.done) return;
  if (action === 'left') { pk.sel = Math.max(0, pk.sel - 1); SFX.click(); }
  else if (action === 'right') { pk.sel = Math.min(pk.opts.length - 1, pk.sel + 1); SFX.click(); }
  else if (action === 'jump') choose(p, pk.sel);
}
function choose(p, k) {
  const pk = p.pick;
  if (!pk || pk.done) return;
  const key = pk.opts[k];
  p.up[key] = (p.up[key] || 0) + 1;
  if (key === 'armor') { p.maxHearts++; p.hearts = p.maxHearts; }
  p.upgradesTaken.push(key);
  pk.sel = k; pk.done = true;
  SFX.power();
}

function updatePlayer(p, dt) {
  p.z += speed * dt;
  p.x += (p.lane * LANE_W - p.x) * Math.min(1, dt * 15);
  p.vy -= (p.up.boots ? 22 : GRAVITY) * dt;
  p.y += p.vy * dt;
  if (p.y < 0) { p.y = 0; p.vy = 0; }
  p.slide -= dt; p.inv -= dt; p.muzzle -= dt; p.jam -= dt; p.spin -= dt;
  p.special = Math.min(100, p.special + dt * 1.5);
  p.rapid = Math.max(0, p.rapid - dt); p.triple = Math.max(0, p.triple - dt); p.magnet = Math.max(0, p.magnet - dt);
  p.comboT -= dt; if (p.comboT <= 0) p.combo = 0;
  const sliding = p.slide > 0 && p.y < 0.05;
  const height = sliding ? SLIDE_H : STAND_H;

  p.extra = p.extra.filter(o => (o.cre ? crePos(o, p)[1] : o.z + o.len) > p.z - 10);
  if (p.chunks.size > 10) { const lo = Math.floor(p.z / CHUNK) - 2; for (const k of [...p.chunks.keys()]) if (k < lo) p.chunks.delete(k); }
  const T = p.T = gather(p);

  // nonstop blaster
  p.fireT -= dt;
  if (p.jam > 0) p.fireT = Math.max(p.fireT, 0);
  else while (p.fireT <= 0) { p.fireT += (p.rapid > 0 ? 0.065 : 0.14) * Math.pow(0.8, p.up.rapid || 0); fire(p, sliding); }
  for (const b of p.bullets) {
    const nz = b.z + BULLET_V * dt;
    let hit = null, best = 1e9;
    for (const t of T) {
      if (t.laser || (!t.breakable && !t.solid) || p.dead.has(t.o.id)) continue;
      if (Math.abs(t.x - b.x) > 1.0 || b.y < t.y0 || b.y > t.y0 + t.h) continue;
      const z0 = t.z - 0.3, z1 = t.z + t.len + 0.3;
      if (nz < z0 || b.z > z1) continue;
      if (z0 < best) { best = z0; hit = t; }
    }
    const B = p.boss, bz = p.z + BOSS_DIST;
    if (hit && (!B || hit.z < bz)) {
      b.dead = true;
      if (hit.solid) burst(p, b.x, b.y, hit.z, [255, 230, 150], 3, 4);
      else damage(p, hit);
    } else if (B && b.z <= bz && nz >= bz && Math.abs(b.x - B.x) < 1.8) {
      b.dead = true;
      hitBoss(p, 1 + (p.up.firepower || 0), b.x);
    }
    b.z = nz;
    if (b.z > p.z + BULLET_RANGE) b.dead = true;
  }
  p.bullets = p.bullets.filter(b => !b.dead);

  // collisions with the runner
  for (const t of T) {
    const id = t.o.id;
    if (p.dead.has(id) || p.hit.has(id)) continue;
    if (Math.abs(t.x - p.x) > 1.2) continue;
    if (p.z + 0.35 < t.z || p.z - 0.35 > t.z + t.len) continue;
    if (p.y >= t.y0 + t.h || p.y + height <= t.y0) continue;
    p.hit.add(id);
    if (t.cre || t.o.type === 'bomb') destroy(p, t, false);
    if (p.inv > 0 || p.spin > 0) continue;
    if (p.shield) {
      p.shield = false; p.inv = 0.8;
      if (t.breakable && !p.dead.has(id)) destroy(p, t, false);
      say(p, '🛡️ SHIELD SAVED YOU!', '#8fb4ff');
      SFX.hit();
      continue;
    }
    p.hearts--; p.inv = 1.5; p.shake = 0.4;
    SFX.hurt();
    if (p.hearts <= 0 && p.up.revive && !p.reviveUsed) {
      p.reviveUsed = true; p.hearts = 2; p.inv = 3;
      say(p, '👼 SECOND WIND!', '#fff6a0');
    } else say(p, p.hearts > 0 ? (t.cre ? `${KINDS[t.o.kind].name} GOT YOU!` : 'OUCH!') : '💀 WASTED 💀', '#ff6b6b');
  }

  // coins & power-ups
  const ml = p.up.magnet || 0, mag = p.magnet > 0;
  for (const ch of chunksIn(p, p.z - 4, p.z + 6)) {
    for (const c of ch.coins) {
      if (p.collected.has(c.id)) continue;
      const dx = Math.abs(c.lane * LANE_W - p.x), dz = Math.abs(c.z - p.z);
      const ok = mag ? (dx < 3.6 && dz < 2.5)
        : ml ? (dx < 1 + ml * 1.2 && dz < 0.8 + ml * 0.6)
        : (dx < 1 && dz < 0.8 && Math.abs(c.y - (p.y + height / 2)) < 1.3);
      if (ok) { p.collected.add(c.id); addCoins(p, 1); if (p.coins % 2) SFX.coin(); }
    }
    for (const w of ch.pows) {
      if (p.collected.has(w.id)) continue;
      if (Math.abs(w.lane * LANE_W - p.x) < 1.1 && Math.abs(w.z - p.z) < 0.9 && Math.abs(w.y - (p.y + height / 2)) < 1.4) {
        p.collected.add(w.id);
        applyPower(p, w.kind);
      }
    }
  }

  // creatures shout their names when they get close
  for (const t of T) {
    if (!t.cre || p.shout.has(t.o.id) || t.z - p.z > 45 || t.z < p.z) continue;
    p.shout.add(t.o.id);
    speak(KINDS[t.o.kind].say);
    if (t.o.kind === 'tung' && p === active[0]) SFX.tung();
  }

  // enemy behaviours
  for (const t of T) {
    if (!t.cre) continue;
    const c = t.o, dz = t.z - p.z;
    if (c.kind === 'assassino' && dz < 42 && dz > 7) {           // dashes into your lane
      const cur = c.cx ?? c.lane * LANE_W, tx = p.lane * LANE_W;
      c.cx = cur + clamp(tx - cur, -6 * dt, 6 * dt);
    } else if (c.kind === 'tralalero' && dz < 34 && dz > 0) c.charge = (c.charge || 0) + speed * dt * 0.7;   // charges
    else if (c.kind === 'bombardino' && !c.dropped && dz < 55 && dz > 20) {   // drops a bomb in your lane
      c.dropped = true;
      p.extra.push(makeObs('bomb', p.lane, p.z + dz - 14, 'b' + spawnN++));
    }
  }
  updateEvents(p, dt);
  if (p.boss) updateBoss(p, dt);

  // planets & route portals
  const si = Math.floor(p.z / STAGE_LEN);
  if (si > p.stage) {
    p.stage = si;
    const st = STAGES[stageIdx(p, si)];
    p.seen.add(stageIdx(p, si));
    say(p, `🪐 ${st.name}`, rgb(st.neon));
    if (p === active[0]) speak(`Benvenuti a ${st.name.toLowerCase()}!`, true);
  }
  const gz = (si + 1) * STAGE_LEN - 14;
  if (!p.gateHint[si] && gz - p.z < 95) { p.gateHint[si] = true; say(p, '🚪 PICK A PORTAL: CHOOSE YOUR ROUTE', '#ffffff'); }
  if (!p.gateDone[si] && p.z >= gz) {
    const g = getChunk(p, (si + 1) * STAGE_CHUNKS - 1).gates.find(g => g.lane === p.lane);
    if (g) applyGate(p, si, g);
  }
}

const score = p => Math.floor(p.z) + p.coins * 10 + p.points;

function finishRun() {
  const before = save.bank;
  banked = active.reduce((s, p) => s + p.coins, 0);
  save.bank += banked;
  newBest = mode === 'solo' && score(players[0]) > save.best;
  if (newBest) save.best = score(players[0]);
  newUnlocks = SKINS.filter(s => s.cost > before && s.cost <= save.bank).map(s => KINDS[s.kind].name);
  persist();
}

function update(dt) {
  clock += dt;
  musicUpdate();
  if (state === 'countdown') {
    countdown -= dt;
    if (countdown <= 0) { state = 'play'; if (gameT === 0) active.forEach(p => say(p, 'GO!', '#fff')); }
  } else if (state === 'play') {
    gameT += dt;
    speed = Math.min(MAX_SPEED, START_SPEED + gameT * ACCEL);
    active.forEach(p => updatePlayer(p, dt));
    if (gameT >= nextBomb) {
      nextBomb = gameT + 25 + Math.random() * 10;
      active.forEach(p => {
        if (p.hearts <= 0) return;
        p.flyby = 0;
        const lanes = [0, 1, 2].map(() => Math.floor(Math.random() * 3) - 1);
        lanes.forEach((l, k) => p.extra.push(makeObs('bomb', l, p.z + 50 + k * 14, 'b' + spawnN++)));
        say(p, '✈️ BOMBARDINO CROCODILO! 💣', '#9dff7a');
      });
      speak('Bombardino Crocodilo!', true);
    }
    const dead = active.filter(p => p.hearts <= 0);
    if (dead.length) {
      state = 'over'; overT = 2.2;
      if (mode === 'duel') {
        if (dead.length === 2) { const [a, b] = players.map(score); result = a === b ? null : players[a > b ? 0 : 1]; }
        else result = players.find(p => p.hearts > 0);
        speak(result ? `Player ${players.indexOf(result) + 1} vince! Bombastico!` : 'Pareggio! Mamma mia!', true);
      } else { result = null; speak('Mamma mia! Game over!', true); }
      finishRun();
    } else if (active.some(p => p.pick && !p.pick.done)) state = 'upgrade';
  } else if (state === 'upgrade') {
    if (active.every(p => !p.pick || p.pick.done)) {
      active.forEach(p => { p.pick = null; });
      state = 'countdown'; countdown = 1.5;
    }
  } else if (state === 'over') {
    overT -= dt;
    if (overT <= 0) state = 'summary';
  }
  for (const p of active) {
    if (state !== 'play') p.T = gather(p);
    p.shake = Math.max(0, p.shake - dt);
    p.camX += (p.x * 0.7 - p.camX) * Math.min(1, dt * 8);
    if (state === 'upgrade') continue;
    if (p.flyby >= 0) { p.flyby += dt; if (p.flyby > 3.5) p.flyby = -1; }
    p.msgs.forEach(m => m.t -= dt);
    p.msgs = p.msgs.filter(m => m.t > 0);
    for (const q of p.parts) { q.x += q.vx * dt; q.y += q.vy * dt; q.z += q.vz * dt + speed * dt * 0.3; q.vy -= 12 * dt; q.life -= dt; }
    p.parts = p.parts.filter(q => q.life > 0);
    for (const f of p.floats) { f.life -= dt; f.y += dt * 1.5; f.dz -= speed * dt * 0.6; }
    p.floats = p.floats.filter(f => f.life > 0);
  }
}

// ---- input -----------------------------------------------------------------
let uiRects = [];
function cycleSkin(i, d) {
  const p = players[i];
  let k = p.skin;
  for (let n = 0; n < SKINS.length; n++) { k = (k + d + SKINS.length) % SKINS.length; if (unlocked(k)) break; }
  p.skin = k; save.skins[i] = k; persist();
  SFX.click();
}
function tap(x, y) {
  for (let i = uiRects.length - 1; i >= 0; i--) {
    const r = uiRects[i];
    if (x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h) { r.fn(); return true; }
  }
  return false;
}
addEventListener('keydown', e => {
  if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Space'].includes(e.code)) e.preventDefault();
  if (e.repeat) return;
  audioInit(); musicStart();
  if (e.code === 'KeyM') { muted = !muted; if (muted && window.speechSynthesis) speechSynthesis.cancel(); return; }
  const go = e.code === 'Space' || e.code === 'Enter';
  if (state === 'home') {
    if (['KeyW', 'KeyS', 'ArrowUp', 'ArrowDown'].includes(e.code)) { homeSel = 1 - homeSel; SFX.click(); }
    else if (e.code === 'KeyA') cycleSkin(0, -1);
    else if (e.code === 'KeyD') cycleSkin(0, 1);
    else if (e.code === 'ArrowLeft') cycleSkin(1, -1);
    else if (e.code === 'ArrowRight') cycleSkin(1, 1);
    else if (go) startGame(homeSel ? 'duel' : 'solo');
    return;
  }
  if (state === 'summary') { if (go) goHome(); return; }
  if (state === 'over') return;
  if (state === 'upgrade' && go && mode === 'solo') { upgradeInput(players[0], 'jump'); return; }
  if (state === 'play') {
    if (mode === 'solo') { if (SPECIAL_SOLO.includes(e.code)) { activateSpecial(players[0]); return; } }
    else for (let i = 0; i < 2; i++) if (SPECIAL_KEYS[i].includes(e.code)) { activateSpecial(players[i]); return; }
  }
  for (const p of active) for (const [action, code] of Object.entries(p.keys)) if (code === e.code) act(p, action);
  if (mode === 'solo') {
    const alt = { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'jump', ArrowDown: 'slide' }[e.code];
    if (alt) act(players[0], alt);
  }
});
addEventListener('mousedown', e => {
  window.focus(); audioInit(); musicStart();
  const rc = cv.getBoundingClientRect();
  tap(e.clientX - rc.left, e.clientY - rc.top);
});

const touches = new Map();
addEventListener('touchstart', e => {
  e.preventDefault();
  audioInit(); musicStart();
  for (const t of e.changedTouches) touches.set(t.identifier, { x: t.clientX, y: t.clientY });
}, { passive: false });
addEventListener('touchend', e => {
  e.preventDefault();
  const rc = cv.getBoundingClientRect();
  for (const t of e.changedTouches) {
    const s = touches.get(t.identifier); touches.delete(t.identifier);
    if (!s) continue;
    if (tap(t.clientX - rc.left, t.clientY - rc.top) || state !== 'play') continue;
    const side = mode === 'solo' ? 0 : W >= H ? (s.x < W / 2 ? 0 : 1) : (s.y < H / 2 ? 0 : 1);
    const dx = t.clientX - s.x, dy = t.clientY - s.y;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) act(players[side], 'jump');
    else if (Math.abs(dx) > Math.abs(dy)) act(players[side], dx < 0 ? 'left' : 'right');
    else act(players[side], dy < 0 ? 'jump' : 'slide');
  }
}, { passive: false });

// ---- 3D-ish rendering ------------------------------------------------------
let cam = null, PAL = palette(players[0], 0), FLASH = false;
const FONT = "'Anton', Impact, 'Arial Narrow Bold', 'Arial Black', sans-serif";
function proj(x, y, z) {
  const s = cam.f / (z - cam.z);
  return [cam.cx + (x - cam.x) * s, cam.hor + (cam.y - y) * s, s];
}
function quad(pts, fill) {
  ctx.fillStyle = fill;
  ctx.beginPath();
  for (let i = 0; i < pts.length; i++) {
    const q = proj(pts[i][0], pts[i][1], pts[i][2]);
    if (i) ctx.lineTo(q[0], q[1]); else ctx.moveTo(q[0], q[1]);
  }
  ctx.closePath();
  ctx.fill();
}
const fogAt = z => clamp((z - cam.z - 35) / (VIEW - 35), 0, 1);

function box(x, y, z, w, h, d, c, extra) {
  const zn = cam.z + NEAR;
  if (z + d < zn) return;
  const z0 = Math.max(z, zn), z1 = z + d;
  const fg = fogAt(z0);
  if (fg >= 1) return;
  const l = x - w / 2, r = x + w / 2, t = y + h;
  if (cam.x < l) quad([[l, y, z0], [l, y, z1], [l, t, z1], [l, t, z0]], mix(c, 0.55, fg));
  if (cam.x > r) quad([[r, y, z0], [r, y, z1], [r, t, z1], [r, t, z0]], mix(c, 0.55, fg));
  if (cam.y > t) quad([[l, t, z0], [r, t, z0], [r, t, z1], [l, t, z1]], mix(c, 1.25, fg));
  quad([[l, y, z0], [r, y, z0], [r, t, z0], [l, t, z0]], mix(c, 0.95, fg));
  if (extra && z >= zn) extra(l, r, y, t, z0, fg);
}

// draws fn in a local space where 1 unit = 1 world unit, origin at (x,y,z), up = negative y
function billboard(x, y, z, fn) {
  if (z < cam.z + NEAR + 0.3) return null;
  const fg = fogAt(z);
  if (fg >= 1) return null;
  const q = proj(x, y, z);
  ctx.save();
  ctx.globalAlpha = 1 - fg;
  ctx.translate(q[0], q[1]);
  ctx.scale(q[2], q[2]);
  fn(q[2]);
  ctx.restore();
  return q;
}

// ---- glossy "AI render" drawing kit ----------------------------------------
const shd = (c, k) => rgb(c.map(v => clamp(v * k, 0, 255)));
const lit = (c, a) => rgb(c.map(v => v + (255 - v) * a));

function RG(x, y, r, stops, fx = x, fy = y) { const g = ctx.createRadialGradient(fx, fy, 0, x, y, Math.max(1e-4, r)); stops.forEach(s => g.addColorStop(s[0], s[1])); return g; }
function shape(pts, fill, stroke, lw) {
  ctx.beginPath();
  pts.forEach((q, i) => i ? ctx.lineTo(q[0], q[1]) : ctx.moveTo(q[0], q[1]));
  ctx.closePath();
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw || 0.04; ctx.stroke(); }
}
function ell(x, y, rx, ry, fill, stroke, lw, rot = 0) {
  ctx.beginPath();
  ctx.ellipse(x, y, Math.abs(rx), Math.abs(ry), rot, 0, PI * 2);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw || 0.04; ctx.stroke(); }
}
function ln(x1, y1, x2, y2, col, lw) {
  ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
}
function rrect(x, y, w, h, r, fill, stroke, lw) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw || 0.04; ctx.stroke(); }
}
// glossy sphere / ellipse with a key light from the upper left
function orb(x, y, rx, ry, c, rot = 0) {
  const r = Math.max(rx, ry);
  ell(x, y, rx, ry, RG(x, y, r * 1.05, [[0, lit(c, 0.65)], [0.35, rgb(c)], [1, shd(c, 0.3)]], x - rx * 0.35, y - ry * 0.45), null, 0, rot);
}
function specular(x, y, rx, ry, a = 0.8) {

}
// additive glow, drawn from cached pre-rendered sprites (much faster than live gradients)
const glowCache = new Map();

  if (!cv2) {
    if (glowCache.size > 300) glowCache.clear();
    cv2 = document.createElement('canvas'); cv2.width = cv2.height = 64;

// ---- sprite cache: complex art is drawn once into offscreen canvases, then blitted
const SPR = new Map(), DSPR = new Map();
function sprite(key, w, h, ox, oy, res, draw, map = SPR) {
  let s = map.get(key);
  if (!s) {
    if (map === DSPR && map.size > 90) map.clear();
    const c = document.createElement('canvas');
    c.width = Math.ceil(w * res); c.height = Math.ceil(h * res);
    const keep = ctx;
    ctx = c.getContext('2d');
    ctx.setTransform(res, 0, 0, res, ox * res, oy * res);
    try { draw(); } finally { ctx = keep; }
    s = { c, w, h, ox, oy };
    map.set(key, s);
  }
  return s;
}
// draw a cached sprite with its origin at (x, y) in the current units
function blit(s, x = 0, y = 0) { ctx.drawImage(s.c, x - s.ox, y - s.oy, s.w, s.h); }

const CHAR_W = { tung: 9, ballerina: 5, assassino: 12, tralalero: 8, bombardino: 3, lirili: 4 };
const NF = 12;
function charSprite(kind, t, idx) {
  const w = CHAR_W[kind];
  let i = idx;
  if (i === undefined) { const ph = ((t * w) / (PI * 2)) % 1; i = Math.floor((ph < 0 ? ph + 1 : ph) * NF) % NF; }
  return sprite(`c:${kind}:${i}`, 3.6, 3.7, 1.8, 3.15, 72, () => KINDS[kind].draw(i / NF * PI * 2 / w));
}
let warmIdx = 0;
function warmCache(n) {   // pre-build character frames a few at a time
  const total = KIND_KEYS.length * NF;
  for (let k = 0; k < n && warmIdx < total; k++, warmIdx++) charSprite(KIND_KEYS[Math.floor(warmIdx / NF)], 0, warmIdx % NF);
}

  // pocket watch
  ctx.save(); ctx.translate(-0.78, -1.95);
  ell(0, 0, 0.2, 0.2, LG(-0.2, -0.2, 0.2, 0.2, [[0, '#fff3a8'], [0.5, '#d4a020'], [1, '#7a5a08']]));
  ell(0, 0, 0.16, 0.16, RG(0, 0, 0.16, [[0, '#ffffff'], [1, '#d8d8e0']], -0.05, -0.05));
  for (let k = 0; k < 12; k++) { const a = k / 12 * PI * 2; ln(Math.cos(a) * 0.12, Math.sin(a) * 0.12, Math.cos(a) * 0.145, Math.sin(a) * 0.145, '#333', 0.012); }
  ln(0, 0, Math.cos(t * 4) * 0.11, Math.sin(t * 4) * 0.11, '#111', 0.02);
  ln(0, 0, Math.cos(1.2) * 0.07, Math.sin(1.2) * 0.07, '#111', 0.03);
  specular(-0.06, -0.07, 0.06, 0.035, 0.9);

  // elephant head

    ell(sd * 0.48, -2.2, 0.22, 0.3, RG(sd * 0.48, -2.2, 0.3, [[0, '#ffc2c8'], [1, '#b07a88']]), null, 0, sd * 0.25);
  }

  ctx.strokeStyle = shd(EG, 0.5); ctx.lineWidth = 0.17; ctx.stroke();
  ctx.strokeStyle = rgb(EG); ctx.lineWidth = 0.12; ctx.stroke();

  eye(-0.15, -2.35, 0.075, [45, 35, 25]);
  eye(0.15, -2.35, 0.075, [45, 35, 25]);
  specular(-0.15, -2.48, 0.12, 0.06, 0.6);
}

// the runner: your chosen brainrot, carrying a blaster
function drawHero(p) {
  const dead = p.hearts <= 0, sliding = p.slide > 0 && p.y < 0.05;
  glow(0, -0.2, 1.1, p.rgb, 0.5);
  ell(0, 0, 0.8, 0.24, null, rgba(p.rgb, 0.9), 0.06);
  ctx.save();
  if (dead) { ctx.translate(0, -0.35); ctx.rotate(-1.45); ctx.translate(0, 1.0); }
  else if (sliding) ctx.scale(1.15, 0.5);
  ctx.scale(0.9, 0.9);
  blit(charSprite(SKINS[p.skin].kind, state === 'play' ? clock * 1.3 : clock * 0.5));
  if (!dead) {
    blit(sprite(`gun:${p.rgb}`, 0.8, 1.3, -0.24, 1.8, 72, () => {
      shape([[0.48, -0.85], [0.74, -0.85], [0.68, -1.55], [0.55, -1.55]], LG(0.48, 0, 0.74, 0, [[0, '#2a2e3a'], [0.45, '#9aa2b8'], [1, '#1a1d26']]));
      ln(0.61, -0.9, 0.61, -1.5, rgb(p.rgb), 0.035);
      glow(0.61, -1.2, 0.18, p.rgb, 0.7);
    }));
    if (p.muzzle > 0) { glow(0.61, -1.62, 0.4, [255, 230, 140], 0.95); star4(0.61, -1.62, 0.22, '#fffbe0'); }
  }
  ctx.restore();
  if (p.spin > 0) { glow(0, -1.1, 1.5, [255, 150, 220], 0.4); sparkles(clock, 8, 1.0, -1.2, 1.0, 0.13); }
  if (p.shield) {
    ell(0, -1.05, 1.1, 1.3, RG(0, -1.05, 1.3, [[0, 'rgba(120,160,255,0.05)'], [0.8, 'rgba(120,170,255,0.2)'], [1, 'rgba(180,210,255,0.7)']]));
    specular(-0.4, -1.8, 0.25, 0.15, 0.5);
  }
}

// ---- scenery ---------------------------------------------------------------
const STARS = Array.from({ length: 150 }, () => ({ u: Math.random(), v: Math.random(), s: Math.random() < 0.12 ? 2 : 1, b: 0.35 + Math.random() * 0.65, tw: 1 + Math.random() * 3, d: 0.3 + Math.random(), sp: Math.random() < 0.07 }));
const CRATERS = Array.from({ length: 7 }, () => ({ a: Math.random() * PI * 2, r: Math.random() * 0.75, s: 0.06 + Math.random() * 0.14 }));
const alt = c => [c[2], c[0], c[1]];

function drawPlanet(st, vw, vh, prog, alpha) {
  if (alpha <= 0.01) return;
  const R = Math.min(vw, vh) * (0.08 + 0.15 * prog), cx = vw * 0.72, cy = Math.max(R * 1.2, vh * 0.2);
  const P = st.planet;
  ctx.save();
  ctx.globalAlpha = alpha;
  // god rays
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.translate(cx, cy);
  ctx.rotate(clock * 0.05);
  const rayCol = st.hole ? [255, 150, 70] : P.c;
  for (let k = 0; k < 12; k++) {
    ctx.rotate(PI * 2 / 12);
    const len = Math.max(vw, vh) * (0.9 + 0.3 * Math.sin(k * 3.1 + clock * 0.7));
    ctx.fillStyle = LG(0, 0, len, 0, [[0, rgba(rayCol, 0.16)], [1, rgba(rayCol, 0)]]);
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(len, -len * 0.05); ctx.lineTo(len, len * 0.05); ctx.fill();
  }
  ctx.restore();
  if (st.hole) {
    glow(cx, cy, R * 2.8, [255, 140, 60], 0.6);
    const disk = (a0, a1) => {
      ctx.lineWidth = R * 0.3; ctx.strokeStyle = 'rgba(255,150,60,0.9)';
      ctx.beginPath(); ctx.ellipse(cx, cy, R * 1.9, R * 0.42, -0.2, a0, a1); ctx.stroke();
      ctx.lineWidth = R * 0.09; ctx.strokeStyle = 'rgba(255,240,200,0.95)';
      ctx.beginPath(); ctx.ellipse(cx, cy, R * 1.55, R * 0.33, -0.2, a0, a1); ctx.stroke();
    };
    disk(PI, PI * 2);
    ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(cx, cy, R, 0, PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(255,210,150,0.9)'; ctx.lineWidth = R * 0.06; ctx.stroke();
    disk(0, PI);
  } else {
    const ring = (a0, a1) => {
      ctx.lineWidth = R * 0.24; ctx.strokeStyle = rgba(P.c.map(v => Math.min(255, v + 40)), 0.8);
      ctx.beginPath(); ctx.ellipse(cx, cy, R * 2.0, R * 0.48, -0.3, a0, a1); ctx.stroke();
      ctx.lineWidth = R * 0.07; ctx.strokeStyle = rgba(P.d, 0.6);
      ctx.beginPath(); ctx.ellipse(cx, cy, R * 1.7, R * 0.4, -0.3, a0, a1); ctx.stroke();
    };
    if (st.ring) ring(PI, PI * 2);
    glow(cx, cy, R * 1.7, P.c, 0.55);
    ctx.fillStyle = RG(cx, cy, R, [[0, rgb(P.c.map(v => Math.min(255, v + 60)))], [0.5, rgb(P.c)], [1, rgb(P.d)]], cx - R * 0.4, cy - R * 0.4);
    ctx.beginPath(); ctx.arc(cx, cy, R, 0, PI * 2); ctx.fill();
    ctx.save();
    ctx.clip();
    if (st.bands) for (let k = 0; k < 7; k++) {
      ctx.fillStyle = rgba(k % 2 ? P.d : P.c.map(v => Math.min(255, v + 40)), 0.3);
      ctx.beginPath(); ctx.ellipse(cx, cy - R + k * R * 0.31 + R * 0.1, R * 1.2, R * 0.065, 0, 0, PI * 2); ctx.fill();
    }
    if (st.craters) for (const c of CRATERS) {
      ctx.fillStyle = rgba(P.d, 0.35);
      ctx.beginPath(); ctx.arc(cx + Math.cos(c.a) * c.r * R, cy + Math.sin(c.a) * c.r * R, c.s * R, 0, PI * 2); ctx.fill();
    }
    ctx.fillStyle = RG(cx - R * 0.3, cy - R * 0.3, R * 1.7, [[0, 'rgba(0,0,0,0)'], [0.45, 'rgba(0,0,0,0)'], [1, 'rgba(0,0,0,0.7)']]);
    ctx.fillRect(cx - R, cy - R, R * 2, R * 2);
    ctx.restore();
    ctx.strokeStyle = rgba(P.c.map(v => Math.min(255, v + 80)), 0.7); ctx.lineWidth = Math.max(1, R * 0.03);
    ctx.beginPath(); ctx.arc(cx, cy, R, PI * 0.9, PI * 1.6); ctx.stroke();
    if (st.ring) ring(0, PI);
  }
  // lens flare toward the screen center
  const dx = vw / 2 - cx, dy = vh * 0.55 - cy;
  [[0.35, 0.18, P.c], [0.6, 0.08, PAL.neon], [0.85, 0.12, alt(PAL.neon)], [1.25, 0.25, P.c]].forEach(([k, s, c]) =>
    glow(cx + dx * k, cy + dy * k, R * s * 2, c, 0.18));
  ctx.restore();
}

// the sky (gradient, nebulae, planet, god rays) is rendered at half resolution ~10x/s and cached
function drawSpace(p, vw, vh) {
  const sc = 0.5, w = Math.max(1, Math.ceil(vw * sc)), h = Math.max(1, Math.ceil(vh * sc));
  if (!p.bg) p.bg = document.createElement('canvas');
  if (p.bg.width !== w || p.bg.height !== h) { p.bg.width = w; p.bg.height = h; p.bgT = -9; }
  if (clock - p.bgT > 0.1 || clock < p.bgT) {
    p.bgT = clock;
    const keep = ctx;
    ctx = p.bg.getContext('2d');
    ctx.setTransform(sc, 0, 0, sc, 0, 0);
    drawSky(vw, vh);
    ctx = keep;
  }
  ctx.drawImage(p.bg, 0, 0, vw, vh);
  ctx.fillStyle = '#fff';
  for (const s of STARS) {
    const x = (((s.u * vw - p.camX * 6 * s.d) % vw) + vw) % vw, y = s.v * vh;
    const a = s.b * (0.6 + 0.4 * Math.sin(clock * s.tw + s.u * 50)) * clamp(Math.abs(y - cam.hor) / (vh * 0.12), 0, 1);
    ctx.globalAlpha = a;
    if (s.sp) star4(x, y, 3 + 3 * Math.sin(clock * s.tw * 2 + s.v * 30) ** 2, '#fff');
    else ctx.fillRect(x, y, s.s, s.s);
  }
  ctx.globalAlpha = 1;
  if (p.flyby >= 0) {
    const k = p.flyby / 3.5, S = Math.min(vw, vh) * 0.1;
    const x = vw * (1.2 - k * 1.45), y = vh * 0.16 + Math.sin(p.flyby * 4) * vh * 0.02;
    ctx.save(); ctx.translate(x, y); ctx.scale(S, S); drawBombardinoSide(clock); ctx.restore();
  }
}

function drawSky(vw, vh) {
  ctx.fillStyle = LG(0, 0, 0, vh, [[0, rgb(PAL.sky)], [clamp(cam.hor / vh, 0.01, 0.99), rgb(PAL.fog)], [1, rgb(PAL.sky)]]);
  ctx.fillRect(0, 0, vw, vh);
  // dreamy nebula clouds
  const n2 = alt(PAL.neon), n3 = [255, 90, 210];
  for (const [u, v, r, c, a] of [[0.2, 0.2, 0.6, PAL.neon, 0.22], [0.85, 0.35, 0.5, n2, 0.2], [0.5, 0.05, 0.45, n3, 0.16], [0.1, 0.6, 0.4, n3, 0.12], [0.9, 0.7, 0.45, PAL.neon, 0.12]])
    glow(vw * (u + Math.sin(clock * 0.1 + u * 9) * 0.03), vh * v, vw * r, c, a);
  if (PAL.b < 1) drawPlanet(PAL.prev, vw, vh, 1, 1 - PAL.b);
  drawPlanet(PAL.cur, vw, vh, PAL.prog, PAL.b);
}

const DECO_VAR = [0, 1, 2].map(v => {
  const r = rngFor(777 + v * 13);
  return { verts: Array.from({ length: 9 }, () => 0.75 + r() * 0.35), shards: Array.from({ length: 5 }, () => 0.9 + r() * 1.4), n: 3 + v };
});
const DECO_BOX = { crystal: [3.2, 3.9, 1.6, 2.6], island: [3.4, 3.8, 1.7, 1.75], mushroom: [3.2, 3.2, 1.6, 2.65], bubble: [2.2, 2.2, 1.1, 1.1], asteroid: [2.4, 2.4, 1.2, 1.2] };
function drawDecoShape(kind, V, nc) {   // unit-size template
  const s = 1;
  if (kind === 'crystal') {
    glow(0, -s * 0.3, s * 1.4, nc, 0.35);
    for (let k = 0; k < V.n; k++) {
      const h = s * V.shards[k], a = (k - (V.n - 1) / 2) * 0.32, w = s * 0.2;
      ctx.save(); ctx.rotate(a);
      shape([[-w, 0], [-w, -h * 0.75], [0, -h], [w, -h * 0.75], [w, 0], [0, w * 0.6]],
        LG(-w, 0, w, 0, [[0, shd(nc, 0.35)], [0.45, lit(nc, 0.5)], [0.52, '#ffffff'], [1, rgb(nc)]]));
      ctx.restore();
    }
  } else if (kind === 'island') {
    glow(0, 0, s * 1.6, nc, 0.2);
    shape([[-s, 0], [s, 0], [s * 0.5, s * 0.5], [s * 0.15, s * 1.2], [-s * 0.4, s * 0.6]], LG(0, 0, 0, s * 1.2, [[0, '#8a6a5a'], [1, '#2a1a20']]));
    ctx.fillStyle = LG(0, 0, 0, s * 2, [[0, 'rgba(190,240,255,0.85)'], [1, 'rgba(190,240,255,0)']]);
    ctx.fillRect(s * 0.5, -0.02, s * 0.14, s * 2);
    ell(0, 0, s, s * 0.22, LG(0, -s * 0.22, 0, s * 0.22, [[0, lit(nc, 0.5)], [1, shd(nc, 0.5)]]));
    for (const [tx, th, tc] of [[-0.5, 0.9, [255, 120, 200]], [0.1, 1.2, nc], [0.55, 0.7, [255, 220, 120]]]) {
      ln(tx * s, -0.05 * s, tx * s, -th * s * 0.6, '#5a3a2a', s * 0.06);
      orb(tx * s, -th * s * 0.7, s * 0.22, s * 0.2, tc);
    }
  } else if (kind === 'mushroom') {
    glow(0, -s * 1.1, s * 1.5, nc, 0.35);
    cyl(-s * 0.14, -s * 1.1, s * 0.28, s * 1.1, s * 0.1, [240, 235, 225]);
    ctx.beginPath(); ctx.ellipse(0, -s * 1.05, s * 0.7, s * 0.5, 0, PI, PI * 2); ctx.closePath();
    ctx.fillStyle = RG(0, -s * 1.05, s * 0.75, [[0, lit(nc, 0.7)], [0.4, rgb(nc)], [1, shd(nc, 0.35)]], -s * 0.25, -s * 1.4); ctx.fill();
    for (const [sx, sy, sr] of [[-0.35, -1.2, 0.09], [0.1, -1.4, 0.11], [0.4, -1.15, 0.07], [-0.1, -1.18, 0.06]]) ell(sx * s, sy * s, sr * s, sr * s * 0.8, 'rgba(255,255,255,0.9)');
  } else if (kind === 'bubble') {
    ell(0, 0, s, s, RG(0, 0, s, [[0, 'rgba(255,255,255,0.02)'], [0.8, rgba(nc, 0.12)], [1, rgba(nc, 0.35)]]));
    ctx.lineWidth = s * 0.06;
    ctx.strokeStyle = LG(-s, -s, s, s, [[0, 'rgba(255,90,200,0.7)'], [0.33, 'rgba(255,230,90,0.7)'], [0.66, 'rgba(90,240,255,0.7)'], [1, 'rgba(160,110,255,0.7)']]);
    ctx.beginPath(); ctx.arc(0, 0, s, 0, PI * 2); ctx.stroke();
    specular(-s * 0.4, -s * 0.45, s * 0.25, s * 0.15, 0.9);
  } else {
    ctx.beginPath();
    V.verts.forEach((v, k) => { const an = k / V.verts.length * PI * 2; const px = Math.cos(an) * v * s, py = Math.sin(an) * v * s; k ? ctx.lineTo(px, py) : ctx.moveTo(px, py); });
    ctx.closePath();
    ctx.fillStyle = RG(0, 0, s, [[0, '#a89cb0'], [0.6, '#5a4e66'], [1, '#221a2a']], -s * 0.35, -s * 0.35); ctx.fill();
    ell(s * 0.25, s * 0.1, s * 0.2, s * 0.15, 'rgba(0,0,0,0.3)');
    ctx.strokeStyle = rgba(nc, 0.6); ctx.lineWidth = s * 0.04; ctx.stroke();
  }
}
function drawDeco(d) {
  const base = PAL.cur.neon, nc = d.hue ? alt(base) : base, v = Math.floor(d.ph) % 3, t = clock + d.ph, B = DECO_BOX[d.kind];
  const spr = sprite(`d:${d.kind}:${v}:${nc.join(',')}`, B[0], B[1], B[2], B[3], 44, () => drawDecoShape(d.kind, DECO_VAR[v], nc), DSPR);
  billboard(d.x, d.y + Math.sin(t * 0.8) * 0.3, d.z, () => {
    ctx.scale(d.s, d.s);
    if (d.kind === 'asteroid') ctx.rotate(t * d.spin);
    blit(spr);
  });
}

function drawTrack(vw, vh) {
  const zn = cam.z + NEAR, zf = cam.z + VIEW, half = LANE_W * 1.5 + 0.35;
  const T = PAL.track, N = PAL.neon;
  quad([[-half, 0, zn], [half, 0, zn], [half, 0, zf], [-half, 0, zf]],
    LG(0, cam.hor, 0, vh, [[0, rgb(PAL.fog)], [0.12, shd(T, 0.55)], [0.6, rgb(T)], [1, lit(T, 0.2)]]));
  ctx.fillStyle = 'rgba(255,255,255,0.05)';
  for (let z = Math.ceil(zn / 4) * 4; z < cam.z + 80; z += 4) {
    if (Math.floor(z / 4) % 2) continue;
    quad([[-half, 0, z], [half, 0, z], [half, 0, z + 2], [-half, 0, z + 2]], 'rgba(255,255,255,0.05)');
  }
  ctx.globalCompositeOperation = 'lighter';
  // glossy reflection of the sky light
  quad([[-half * 0.8, 0, zn], [half * 0.8, 0, zn], [half * 0.2, 0, zf], [-half * 0.2, 0, zf]],
    LG(0, cam.hor, 0, vh, [[0, rgba(PAL.cur.planet.c, 0.1)], [0.5, rgba(N, 0.03)], [1, rgba(N, 0.08)]]));
  for (let z = Math.ceil(zn / 6) * 6; z < cam.z + 70; z += 6)
    for (let lane = -1; lane <= 1; lane++) {
      const x = lane * LANE_W;
      quad([[x - 0.22, 0.01, z], [x + 0.22, 0.01, z], [x, 0.01, z + 1.3]], rgba(N, 0.4 * (1 - fogAt(z))));
    }
  for (const x of [-LANE_W / 2, LANE_W / 2]) {
    quad([[x - 0.2, 0.01, zn], [x + 0.2, 0.01, zn], [x + 0.2, 0.01, zf], [x - 0.2, 0.01, zf]], rgba(N, 0.12));
    quad([[x - 0.04, 0.01, zn], [x + 0.04, 0.01, zn], [x + 0.04, 0.01, zf], [x - 0.04, 0.01, zf]], rgba(N, 0.6));
  }
  for (const s of [-1, 1]) {
    const x = s * half;
    quad([[x - 0.7, 0.02, zn], [x + 0.7, 0.02, zn], [x + 0.7, 0.02, zf], [x - 0.7, 0.02, zf]], rgba(N, 0.18));
    quad([[x - 0.15, 0.02, zn], [x + 0.15, 0.02, zn], [x + 0.15, 0.02, zf], [x - 0.15, 0.02, zf]], rgba(N, 0.9));
    quad([[x - 0.04, 0.03, zn], [x + 0.04, 0.03, zn], [x + 0.04, 0.03, zf], [x - 0.04, 0.03, zf]], 'rgba(255,255,255,0.8)');
  }
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = LG(0, cam.hor - 2, 0, cam.hor + vh * 0.05, [[0, rgba(PAL.fog, 1)], [1, rgba(PAL.fog, 0)]]);
  ctx.fillRect(0, cam.hor - 2, vw, vh * 0.05 + 2);
}

const FREIGHT_NAMES = ['TUNG EXPRESS', 'CAPPUCCINO CARGO', 'BRR BRR FREIGHT', 'LA VACA LINES', 'TRALALA TRANSIT', 'PATAPIM POST'];

function drawTarget(p, t) {
  const o = t.o;
  FLASH = clock - (p.flash.get(o.id) ?? -9) < 0.07;
  if (t.cre) {
    const K = KINDS[o.kind];
    const q = billboard(t.x, 0, t.z + 0.4, () => {
      if (o.attack) { glow(0, -1.2, 1.6, [180, 80, 255], 0.5); ell(0, 0, 0.9, 0.25, 'rgba(190,90,255,0.55)'); }
      ctx.scale(CRE_S, CRE_S);
      blit(charSprite(o.kind, clock + o.z0));
      if (FLASH) glow(0, -K.h * 0.5, 1.3, [255, 255, 255], 0.9);
    });
    if (q && p.hp.has(o.id) && t.z - p.z < 55 && t.z > p.z - 1) {
      const top = proj(t.x, K.h * CRE_S + 0.3, t.z + 0.4);
      const fs = clamp(q[2] * 0.34, 10, 24);
      if (p.hp.has(o.id)) {
        const bw = q[2] * 1.3, frac = p.hp.get(o.id) / K.hp, bh = Math.max(3, fs * 0.25);
        ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(top[0] - bw / 2, top[1] + fs * 0.7, bw, bh);
        ctx.fillStyle = LG(top[0] - bw / 2, 0, top[0] + bw / 2, 0, [[0, '#ff3a3a'], [0.5, '#ffe14d'], [1, '#5dff6a']]);
        ctx.fillRect(top[0] - bw / 2, top[1] + fs * 0.7, bw * frac, bh);
      }
    }
  } else if (o.type === 'freighter') {
    const c = PAL.deco.map(v => v * 0.4 + 90);
    const ghost = o.z < p.z + 1 && Math.abs(t.x - p.x) < 1.6; // runner is inside/next to it: see-through
    if (ghost) ctx.globalAlpha = 0.3;
    box(t.x, 0, o.z, 2.0, o.h, o.len, c, (l, r, y, top, z0, fg) => {
      const a = proj(l, top, z0 - 0.01), b = proj(r, y, z0 - 0.01);
      const nm = FREIGHT_NAMES[Math.abs(Math.floor(o.z * 7)) % FREIGHT_NAMES.length], N = PAL.cur.neon;
      const spr = sprite(`fr:${nm}:${N}`, 2, 2.7, 0, 0, 90, () => {
        const w = 2, h = 2.7;
        rrect(0, 0, w, h, w * 0.08, LG(0, 0, w, 0, [[0, '#4a5060'], [0.3, '#dfe4ee'], [0.55, '#9aa2b4'], [1, '#3a404e']]));
        rrect(w * 0.1, h * 0.1, w * 0.8, h * 0.2, w * 0.04, LG(0, 0, 0, h * 0.3, [[0, rgba(N, 0.9)], [1, '#101826']]));
        specular(w * 0.3, h * 0.15, w * 0.15, h * 0.04, 0.8);
        for (let k = 0; k < 8; k++) { ctx.fillStyle = k % 2 ? '#1a1a1a' : '#ffc928'; ctx.fillRect(k * w / 8, h * 0.8, w / 8 + 0.01, h * 0.1); }
        for (const lx of [0.22, 0.78]) { glow(w * lx, h * 0.6, w * 0.22, N, 0.9); ell(w * lx, h * 0.6, w * 0.06, w * 0.06, '#fff'); }
        text(nm, w / 2, h * 0.44, Math.min(w / (nm.length * 0.5), h * 0.09), '#ffffff', 'center');
      }, DSPR);
      const ga = ctx.globalAlpha;
      ctx.globalAlpha = ga * (1 - fg);
      ctx.drawImage(spr.c, a[0], a[1], b[0] - a[0], b[1] - a[1]);
      ctx.globalAlpha = ga;
    });
    ctx.globalAlpha = 1;
  } else if (o.type === 'laser') {
    const post = sprite('post', 1, 3.05, 0.5, 3.0, 64, () => {
      cyl(-0.1, -2.5, 0.2, 2.5, 0.08, [150, 156, 176]);
      orb(0, -2.5, 0.14, 0.14, [255, 60, 90]);
      glow(0, -2.5, 0.45, [255, 60, 90], 0.7);
    });
    for (const sd of [-1, 1]) billboard(t.x + sd * 1.0, 0, o.z, () => blit(post));
    if (o.z < cam.z + NEAR) return;
    const fg = fogAt(o.z);
    const a = proj(t.x - 0.95, o.y0, o.z), b = proj(t.x + 0.95, o.y0 + o.h, o.z);
    const fl = 0.75 + 0.25 * Math.sin(clock * 30);
    ctx.save();
    ctx.globalAlpha = (1 - fg) * fl;
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = LG(0, b[1], 0, a[1], [[0, 'rgba(255,40,90,0.05)'], [0.5, 'rgba(255,40,90,0.4)'], [1, 'rgba(255,40,90,0.05)']]);
    ctx.fillRect(a[0], b[1], b[0] - a[0], a[1] - b[1]);
    for (let k = 1; k <= 3; k++) {
      const yy = b[1] + (a[1] - b[1]) * k / 4, th = Math.max(2, a[2] * 0.06);
      ctx.fillStyle = 'rgba(255,80,120,0.6)'; ctx.fillRect(a[0], yy - th * 2, b[0] - a[0], th * 4);
      ctx.fillStyle = '#fff0f4'; ctx.fillRect(a[0], yy - th / 2, b[0] - a[0], th);
    }
    ctx.restore();
  } else if (o.type === 'crate') {
    billboard(t.x, 0, o.z + 0.5, () => {
      const s = 0.65, h = 1.15;
      blit(sprite('crate', 2.8, 2.8, 1.4, 2.0, 64, () => {
        glow(0, -h / 2, 1.3, [255, 200, 60], 0.45);
        shape([[-s, -h], [s, -h], [s * 0.78, -h - 0.22], [-s * 0.78, -h - 0.22]], LG(0, -h - 0.22, 0, -h, [[0, '#fff6c0'], [1, '#f2c040']]));
        rrect(-s, -h, 2 * s, h, 0.06, LG(0, -h, 0, 0, [[0, '#ffe788'], [0.5, '#f0a81a'], [1, '#8a5206']]), '#fff3b0', 0.03);
        glow(0, -h / 2, 0.5, [255, 255, 210], 0.7);
        text('?', 0, -h / 2, 0.85, '#ffffff', 'center');
        specular(-0.35, -h + 0.18, 0.18, 0.06, 0.9);
      }));
      if (Math.sin(clock * 5 + o.z) > 0.6) star4(s * 0.8, -h, 0.18, '#fff');
      if (FLASH) glow(0, -h / 2, 1.2, [255, 255, 255], 0.9);
    });
  } else if (o.type === 'bomb') {
    const drop = clamp((o.t0 + 1.0 - clock) * 12, 0, 14);
    billboard(t.x, drop, o.z + 0.4, () => {
      blit(sprite('bomb', 1.2, 1.45, 0.6, 1.2, 64, () => {
        softShadow(0.45);
        orb(0, -0.45, 0.45, 0.45, [38, 36, 50]);
        specular(-0.15, -0.62, 0.14, 0.09, 0.8);
        rrect(-0.08, -0.95, 0.16, 0.1, 0.02, '#6a6a76');
        ln(0.02, -0.95, 0.2, -1.12, '#c0905a', 0.05);
      }));
      glow(0.22, -1.14, 0.25 + Math.random() * 0.1, [255, 180, 60], 0.9);
      star4(0.22, -1.14, 0.12, '#fff');
      if (Math.sin(clock * 8) > 0) glow(0, -0.45, 0.25, [255, 40, 40], 0.9);
      if (FLASH) glow(0, -0.45, 0.8, [255, 255, 255], 0.9);
    });
  } else { // magma rock (falls from the sky when thrown by a boss or a meteor shower)
    const drop = o.t0 ? clamp((o.t0 + 0.8 - clock) * 14, 0, 12) : 0;
    billboard(t.x, drop, o.z + 0.3, () => {
      const v = Math.abs(Math.floor(o.z * 3)) % 3;
      blit(sprite(`rock:${v}`, 2.2, 1.5, 1.1, 1.15, 64, () => {
        softShadow(0.9);
        ctx.beginPath();
        for (let k = 0; k < 10; k++) {
          const a = k / 10 * PI * 2, rr = 0.85 + 0.15 * Math.sin(k * 2.7 + v * 1.9);
          const px = Math.cos(a) * 0.95 * rr, py = -0.5 + Math.sin(a) * 0.55 * rr;
          k ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
        }
        ctx.closePath();
        ctx.fillStyle = RG(0, -0.5, 1, [[0, '#8c7c92'], [0.6, '#4a3e54'], [1, '#1c1424']], -0.3, -0.8); ctx.fill();
        ctx.strokeStyle = 'rgba(255,150,50,0.9)'; ctx.lineWidth = 0.05; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(-0.6, -0.4); ctx.lineTo(-0.2, -0.55); ctx.lineTo(0.1, -0.35); ctx.lineTo(0.55, -0.6);
        ctx.moveTo(-0.2, -0.55); ctx.lineTo(-0.1, -0.85); ctx.stroke();
        specular(-0.35, -0.82, 0.3, 0.07, 0.4);
      }));
      glow(-0.1, -0.5, 0.6, [255, 120, 30], 0.15 + 0.15 * Math.sin(clock * 4 + o.z));
      if (FLASH) glow(0, -0.5, 1.1, [255, 255, 255], 0.9);
    });
  }
  FLASH = false;
}

function drawCoin(c) {
  billboard(c.lane * LANE_W, c.y, c.z, () => {
    const sx = Math.max(0.15, Math.abs(Math.cos(clock * 4 + c.z)));
    ctx.save(); ctx.scale(sx, 1);
    blit(sprite('coin', 1.5, 1.5, 0.75, 0.75, 64, () => {
      glow(0, 0, 0.7, [255, 200, 50], 0.4);
      ell(0, 0, 0.36, 0.36, LG(-0.36, -0.36, 0.36, 0.36, [[0, '#fff3a0'], [0.5, '#ffbf1a'], [1, '#a06a00']]));
      ell(0, 0, 0.24, 0.24, LG(0.24, 0.24, -0.24, -0.24, [[0, '#fff3a0'], [0.5, '#ffcc33'], [1, '#c08000']]));
      specular(-0.1, -0.14, 0.1, 0.06, 0.9);
    }));
    ctx.restore();
    if (Math.sin(clock * 3 + c.z * 2) > 0.85) star4(0.2 * sx, -0.25, 0.2, '#fff');
  });
}

function drawPower(w) {
  const P = POWERS[w.kind], col = [parseInt(P.col.slice(1, 3), 16), parseInt(P.col.slice(3, 5), 16), parseInt(P.col.slice(5, 7), 16)];
  const q = billboard(w.lane * LANE_W, w.y + Math.sin(clock * 3 + w.z) * 0.15, w.z, () => {
    blit(sprite(`pw:${w.kind}`, 2.1, 2.1, 1.05, 1.05, 64, () => {
      glow(0, 0, 1.0, col, 0.7);
      orb(0, 0, 0.45, 0.45, col);
      specular(-0.15, -0.2, 0.15, 0.1, 0.9);
      text(P.icon, 0, 0.02, 0.5, '#fff', 'center');
    }));
    ctx.strokeStyle = 'rgba(255,255,255,0.8)'; ctx.lineWidth = 0.04;
    ctx.beginPath(); ctx.ellipse(0, 0, 0.7, 0.2, clock * 2, 0, PI * 2); ctx.stroke();
  });
  if (q && w.z - cam.z < 30) text(P.label, q[0], q[1] - q[2] * 0.8, clamp(q[2] * 0.18, 8, 12), P.col, 'center');
}

function drawView(p, vw, vh) {
  PAL = palette(p, p.z); FOG = PAL.fog;
  const f = Math.min(vw * 0.8, vh * 0.95);
  cam = { x: p.camX, y: CAM_H + p.y * 0.45, z: p.z - CAM_D, f, cx: vw / 2, hor: Math.max(vh * 0.12, vh * 0.84 - CAM_H * f / CAM_D) };
  drawSpace(p, vw, vh);

  const items = [];
  for (const ch of chunksIn(p, cam.z, cam.z + VIEW)) {
    for (const d of ch.deco) items.push({ z: d.z, d: () => drawDeco(d) });
    for (const c of ch.coins) if (!p.collected.has(c.id)) items.push({ z: c.z, d: () => drawCoin(c) });
    for (const w of ch.pows) if (!p.collected.has(w.id)) items.push({ z: w.z, d: () => drawPower(w) });
    for (const g of ch.gates) if (g.z > cam.z + 1) items.push({ z: g.z, d: () => drawGate(p, g) });
  }
  if (p.boss) {
    const B = p.boss;
    items.push({ z: p.z + BOSS_DIST, d: () => billboard(B.x, 0.3 + Math.sin(clock * 2) * 0.25, p.z + BOSS_DIST, () => {
      glow(0, -2.8, 3.4, [255, 60, 80], 0.45);
      ctx.save();
      const sc = 2.4 * (1 + Math.max(0, B.throwT) * 0.25);
      ctx.scale(sc, sc);
      blit(charSprite(B.kind, clock * 1.4));
      ctx.restore();
      if (clock - B.flash < 0.06) glow(0, -2.8, 2.6, [255, 255, 255], 0.7);
    }) });
  }
  for (const t of p.T) if (t.z + t.len > cam.z && t.z < cam.z + VIEW) items.push({ z: t.z, d: () => drawTarget(p, t) });
  for (const b of p.bullets) items.push({ z: b.z, d: () => {
    if (b.z < cam.z + NEAR) return;
    const a = proj(b.x, b.y, b.z), e = proj(b.x, b.y, b.z + 1.8);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(e[0], e[1]);
    ctx.strokeStyle = rgba(p.rgb, 0.35); ctx.lineWidth = Math.max(4, a[2] * 0.4); ctx.stroke();
    ctx.strokeStyle = rgba(p.rgb, 0.9); ctx.lineWidth = Math.max(2, a[2] * 0.14); ctx.stroke();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = Math.max(1, a[2] * 0.05); ctx.stroke();
    ctx.restore();
  } });
  for (const q of p.parts) items.push({ z: q.z, d: () => {
    if (q.z < cam.z + NEAR) return;
    const s = proj(q.x, q.y, q.z), sz = clamp(0.2 * s[2], 2, 12);
    ctx.globalAlpha = clamp(q.life * 2, 0, 1);
    glow(s[0], s[1], sz * 1.6, q.col, 0.9);
    ctx.globalAlpha = 1;
  } });
  if (state !== 'home') items.push({ z: p.z - 0.3, d: () => billboard(p.x, p.y, p.z, () => {
    if (p.inv > 0 && Math.floor(p.inv * 12) % 2) return;
    drawHero(p);
  }) });
  items.sort((a, b) => b.z - a.z);
  drawTrack(vw, vh);
  // runner's shadow on the track
  const sp = proj(p.x, 0, p.z);
  if (state !== 'home') ell(sp[0], sp[1], 0.55 * sp[2], 0.18 * sp[2], RG(sp[0], sp[1], 0.55 * sp[2], [[0, 'rgba(0,0,0,0.5)'], [1, 'rgba(0,0,0,0)']]));
  for (const it of items) it.d();

  for (const fl of p.floats) {
    const z = p.z + fl.dz;
    if (z < cam.z + NEAR + 1) continue;
    const q = proj(fl.x, fl.y, z);
    ctx.globalAlpha = clamp(fl.life * 2, 0, 1);
    text(fl.text, q[0], q[1], clamp(q[2] * 0.2, 10, 16), fl.color, 'center');
    ctx.globalAlpha = 1;
  }
  // vignette
  const vk = `vig:${Math.round(vw)}x${Math.round(vh)}`;
  const vg = sprite(vk, vw, vh, 0, 0, 0.25, () => {
    ctx.fillStyle = RG(vw / 2, vh / 2, Math.hypot(vw, vh) * 0.6, [[0, 'rgba(0,0,0,0)'], [0.65, 'rgba(0,0,0,0)'], [1, 'rgba(0,0,0,0.55)']]);
    ctx.fillRect(0, 0, vw, vh);
  }, DSPR);
  ctx.drawImage(vg.c, 0, 0, vw, vh);
}

// ---- HUD & screens ---------------------------------------------------------
function heart(x, y, s, filled) {
  heartPath(x, y, s);
  ctx.fillStyle = filled ? LG(x - s / 2, y, x + s / 2, y + s, [[0, '#ff9aae'], [0.5, '#ff2f55'], [1, '#a0102a']]) : 'rgba(255,255,255,0.18)';
  ctx.fill();
  if (filled) specular(x - s * 0.22, y + s * 0.25, s * 0.12, s * 0.08, 0.9);
}

function text(str, x, y, size, color, align = 'left') {
  ctx.font = `${size}px ${FONT}`;
  ctx.textAlign = align; ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round';
  ctx.lineWidth = Math.max(size * 0.02, size / 5.5); ctx.strokeStyle = 'rgba(0,0,0,0.85)';
  ctx.strokeText(str, x, y);
  ctx.fillStyle = color; ctx.fillText(str, x, y);
}
function wrapLines(str, maxW, size) {
  ctx.font = `${size}px ${FONT}`;
  const lines = []; let cur = '';
  for (const w of str.split(' ')) {
    const t = cur ? cur + ' ' + w : w;
    if (ctx.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t;
  }
  if (cur) lines.push(cur);
  return lines;
}
// clickable button; ox/oy = where the current drawing origin sits on the screen
function button(x, y, w, h, label, sel, fn, ox = 0, oy = 0) {
  if (sel) glow(x + w / 2, y + h / 2, w * 0.7, [255, 200, 80], 0.45);
  rrect(x, y, w, h, h * 0.3, LG(0, y, 0, y + h, sel ? [[0, '#ffe27a'], [0.5, '#ff9a1a'], [1, '#d4501a']] : [[0, '#4a4f7a'], [1, '#1c1f3a']]),
    sel ? '#fff6c8' : 'rgba(255,255,255,0.35)', sel ? 3 : 1.5);
  specular(x + w * 0.3, y + h * 0.25, w * 0.25, h * 0.12, 0.35);
  text(label, x + w / 2, y + h / 2, Math.min(h * 0.45, w / Math.max(4, label.length * 0.5)), '#fff', 'center');
  uiRects.push({ x: x + ox, y: y + oy, w, h, fn });
}
function sparklesScreen(cx, cy, r, u) {
  for (let k = 0; k < 10; k++) {
    const a = clock * 0.6 + k * 0.63, tw = Math.sin(clock * 4 + k * 1.3);
    if (tw < 0.1) continue;
    star4(cx + Math.cos(a) * r, cy + Math.sin(a * 1.7) * r * 0.4, u * 0.6 * tw, 'rgba(255,250,220,0.95)');
  }
}
function drawGate(p, g) {
  const M = MODS[g.mod], st = STAGES[g.planet], col = hex2(M.col);
  const spr = sprite(`g:${g.planet}:${g.mod}`, 3.8, 3.8, 1.9, 3.15, 56, () => {
    glow(0, -1.25, 1.9, col, 0.5);
    ell(0, -1.25, 0.9, 1.2, RG(0, -1.25, 1.2, [[0, rgba(st.planet.c, 0.75)], [0.7, rgba(st.neon, 0.35)], [1, rgba(st.neon, 0.05)]]));
    orb(0, -1.25, 0.32, 0.32, st.hole ? [40, 20, 40] : st.planet.c);
    ctx.lineWidth = 0.16;
    ctx.strokeStyle = LG(-0.9, -2.45, 0.9, 0, [[0, '#ffffff'], [0.5, M.col], [1, '#ffffff']]);
    ctx.beginPath(); ctx.ellipse(0, -1.25, 0.9, 1.2, 0, 0, PI * 2); ctx.stroke();
  });
  const q = billboard(g.lane * LANE_W, 0, g.z, () => {
    blit(spr);
    ctx.save(); ctx.translate(0, -1.25); ctx.rotate(clock * 2);
    ctx.strokeStyle = rgba(st.neon, 0.85); ctx.lineWidth = 0.06;
    for (let k = 0; k < 3; k++) { ctx.rotate(PI * 2 / 3); ctx.beginPath(); ctx.ellipse(0, 0, 0.6, 0.85, 0, 0, PI * 0.8); ctx.stroke(); }
    ctx.restore();
  });
  if (q && g.z > p.z && g.z - p.z < 55) {
    const top = proj(g.lane * LANE_W, 2.8, g.z), fs = clamp(q[2] * 0.22, 10, 16);
    text(`${M.icon} ${M.name}`, top[0], top[1] - fs * 1.9, fs, M.col, 'center');
    text(st.name, top[0], top[1] - fs * 0.85, fs * 0.8, '#ffffff', 'center');
    if (g.z - p.z < 35) for (const [k, line] of wrapLines(M.desc, q[2] * 2.0, fs * 0.62).entries()) text(line, top[0], top[1] + k * fs * 0.7, fs * 0.62, '#e4e0f0', 'center');
  }
}

function drawUpgrade(p, vw, vh, ox, oy, u) {
  ctx.fillStyle = 'rgba(6,4,20,0.74)'; ctx.fillRect(0, 0, vw, vh);
  const pk = p.pick;
  text('✨ PICK AN UPGRADE ✨', vw / 2, vh * 0.2, Math.min(u * 1.3, vw / 14), '#ffd23f', 'center');
  const n = pk.opts.length, cw = Math.min(vw * 0.29, u * 9, vh * 0.42 / 1.35), chh = cw * 1.35, gap = cw * 0.08;
  let x = (vw - (n * cw + (n - 1) * gap)) / 2;
  const y = vh * 0.28;
  pk.opts.forEach((key, k) => {
    const U = UPGRADES[key], sel = k === pk.sel, lv = p.up[key] || 0;
    const dim = pk.done && !sel;
    ctx.save();
    ctx.translate(x + cw / 2, y + chh / 2);
    if (sel) ctx.scale(1.06, 1.06);
    ctx.globalAlpha = dim ? 0.35 : 1;
    if (sel) glow(0, 0, cw * 0.95, U.duel ? [255, 90, 220] : [255, 210, 80], 0.55);
    rrect(-cw / 2, -chh / 2, cw, chh, cw * 0.08,
      LG(0, -chh / 2, 0, chh / 2, U.duel ? [[0, '#6a2482'], [1, '#2a0a36']] : U.solo ? [[0, '#24625a'], [1, '#0a2a26']] : [[0, '#2a3a72'], [1, '#0e1330']]),
      sel ? '#ffe27a' : 'rgba(255,255,255,0.35)', sel ? 4 : 2);
    specular(-cw * 0.2, -chh * 0.4, cw * 0.3, chh * 0.05, 0.3);
    text(U.icon, 0, -chh * 0.26, cw * 0.28, '#fff', 'center');
    ctx.font = `${cw * 0.13}px ${FONT}`;
    const ns = Math.min(cw * 0.13, cw * 0.13 * cw * 0.88 / Math.max(1, ctx.measureText(U.name).width));
    text(U.name, 0, -chh * 0.03, ns, '#fff', 'center');
    wrapLines(U.desc, cw * 0.84, cw * 0.075).forEach((l, i) => text(l, 0, chh * 0.1 + i * cw * 0.09, cw * 0.075, '#d8dcf0', 'center'));
    text(lv ? `LV ${lv} → ${lv + 1}` : U.duel ? '⚔️ COMPETITIVE' : 'NEW', 0, chh * 0.41, cw * 0.075, U.duel ? '#ff8ae0' : '#9dffb0', 'center');
    ctx.restore();
    uiRects.push({ x: x + ox, y: y + oy, w: cw, h: chh, fn: () => { if (!pk.done) choose(p, k); } });
    x += cw + gap;
  });
  const hint = pk.done ? (mode === 'duel' ? '⏳ WAITING FOR YOUR RIVAL…' : '')
    : mode === 'solo' ? '◀ ▶ CHOOSE  ·  ▲ OR SPACE TO CONFIRM  ·  OR CLICK A CARD'
    : p === players[0] ? 'A / D CHOOSE  ·  W CONFIRM' : '← / → CHOOSE  ·  ↑ CONFIRM';
  if (hint) text(hint, vw / 2, y + chh + u * 1.6, Math.min(u * 0.7, vw / (hint.length * 0.5)), '#fff', 'center');
}

function drawHUD(p, vw, vh, ox, oy) {
  const u = Math.max(13, Math.min(vw, vh) * 0.042);
  rrect(u * 0.6, u * 0.6, u * 2.4, u * 1.4, u * 0.3, LG(0, u * 0.6, 0, u * 2, [[0, lit(p.rgb, 0.4)], [1, shd(p.rgb, 0.6)]]));
  text(mode === 'solo' ? 'YOU' : p.name, u * 1.8, u * 1.3, u * 1.0, '#fff', 'center');
  const hs = u * 0.9, step = u * 1.2;
  for (let i = 0; i < p.maxHearts; i++) heart(u * 3.8 + i * step, u * 0.85, hs, i < p.hearts);
  let hx = u * 3.8 + p.maxHearts * step - step * 0.4;
  if (p.shield) { text('🛡️', hx + u * 0.4, u * 1.3, u * 0.9, '#8fb4ff', 'center'); hx += u * 1.1; }
  text(String(score(p)), vw - u * 0.7, u * 1.3, u * 1.3, '#fff', 'right');
  text(`💀 KILLS ${p.kills}`, vw - u * 0.7, u * 2.6, u * 0.65, '#ffe14d', 'right');
  if (p.combo >= 2) {
    const pulse = 1 + Math.max(0, p.comboT - 2) * 0.4;
    text(`🔥 COMBO x${p.combo}`, vw - u * 0.7, u * 3.6, u * 0.85 * Math.min(1.4, pulse), '#ffd23f', 'right');
  }
  const mx = u * 0.6, my = u * 2.4, mw = Math.min(vw * 0.45, u * 10), mh = u * 0.62, cost = attackCost(p);
  rrect(mx, my, mw, mh, mh / 2, 'rgba(0,0,0,0.5)');
  if (p.meter > 0) rrect(mx, my, Math.max(mh, mw * p.meter / cost), mh, mh / 2, LG(mx, 0, mx + mw, 0, [[0, '#ff5fd2'], [1, '#8a4dff']]));
  text(`🪙 ${p.coins}   ${opp(p) ? 'BRAINROT ATTACK' : 'BRAINROT NUKE'} ${p.meter}/${cost}`, mx + 8, my + mh / 2, u * 0.5, '#fff');
  let py = my + mh + u * 0.5;
  for (const [key, val, max] of [['rapid', p.rapid, 8], ['triple', p.triple, 8], ['magnet', p.magnet, 10]]) {
    if (val <= 0) continue;
    const P = POWERS[key];
    rrect(mx, py, mw * 0.6, mh * 0.75, mh * 0.35, 'rgba(0,0,0,0.5)');
    rrect(mx, py, Math.max(mh * 0.75, mw * 0.6 * val / max), mh * 0.75, mh * 0.35, P.col);
    text(P.label, mx + 8, py + mh * 0.38, u * 0.45, '#fff');
    py += mh;
  }
  if (p.jam > 0) { text(`⏰ BLASTER JAMMED ${p.jam.toFixed(1)}s`, mx, py + mh * 0.5, u * 0.6, '#9dffb0'); py += mh * 1.2; }
  const ups = Object.entries(p.up).map(([k, v]) => UPGRADES[k].icon + (v > 1 ? v : '')).join(' ');
  if (ups) text(ups, mx, py + mh * 0.6, u * 0.55, '#fff');
  if (p.boss) {
    const B = p.boss, bw = vw * 0.42, bx0 = (vw - bw) / 2, by0 = vh - u * 1.5, bh = u * 0.5;
    text(`☠️ GIGA ${KINDS[B.kind].name}`, vw / 2, by0 - u * 0.45, u * 0.55, '#ff8a8a', 'center');
    rrect(bx0, by0, bw, bh, bh / 2, 'rgba(0,0,0,0.6)');
    rrect(bx0, by0, Math.max(bh, bw * B.hp / B.max), bh, bh / 2, LG(bx0, 0, bx0 + bw, 0, [[0, '#ff2a4a'], [1, '#ff9a3a']]));
  }
  // special ability button (press E / Enter, or click / tap it)
  {
    const SK = SKINS[p.skin], R = u * 1.5, bx = vw - u * 2.2, by = vh - u * 2.6, ready = p.special >= 100;
    if (ready) glow(bx, by, R * 2.2, [255, 210, 80], 0.45 + 0.25 * Math.sin(clock * 8));
    ell(bx, by, R, R, RG(bx, by, R, [[0, ready ? '#5a3a10' : '#2a2a48'], [1, ready ? '#2a1404' : '#0e0e1e']]), 'rgba(255,255,255,0.3)', 2);
    ctx.lineCap = 'round'; ctx.lineWidth = u * 0.22; ctx.strokeStyle = ready ? '#ffe27a' : rgb(p.rgb);
    ctx.beginPath(); ctx.arc(bx, by, R * 0.88, -PI / 2, -PI / 2 + PI * 2 * p.special / 100); ctx.stroke();
    ctx.globalAlpha = ready ? 1 : 0.45;
    text(SK.ab.icon, bx, by, R * (ready ? 0.95 + 0.08 * Math.sin(clock * 10) : 0.85), '#fff', 'center');
    ctx.globalAlpha = 1;
    const key = mode === 'solo' ? 'E' : p === players[0] ? 'E' : 'ENTER';
    text(ready ? `${SK.ab.name} [${key}]` : `${Math.floor(p.special)}%`, bx, by + R + u * 0.45, u * 0.48, ready ? '#ffe27a' : '#aab', 'center');
    uiRects.push({ x: ox + bx - R, y: oy + by - R, w: R * 2, h: R * 2, fn: () => activateSpecial(p) });
  }
  const pal = palette(p, p.z), md = p.mods[pal.i];
  text(`🪐 ${pal.cur.name}${md ? `  ·  ${MODS[md].icon} ${MODS[md].name}` : ''}`, u * 0.7, vh - u * 0.9, u * 0.6, rgb(pal.neon));
  p.msgs.forEach((m, k) => {
    ctx.globalAlpha = clamp(m.t * 2, 0, 1);
    const x0 = hx + u * 0.5, x1 = vw - u * 4.4, maxW = Math.max(40, x1 - x0);
    ctx.font = `${u}px ${FONT}`;
    const pop = 1 + Math.max(0, m.t - 1.35) * 0.8;
    const size = Math.min(u * 0.8 * pop, u * maxW / Math.max(1, ctx.measureText(m.text).width));
    text(m.text, (x0 + x1) / 2, u * 1.3 + k * u * 1.1, size, m.color, 'center');
    ctx.globalAlpha = 1;
  });
  if (state === 'countdown') text(String(Math.ceil(countdown)), vw / 2, vh * 0.4, u * 4 * (1 + (countdown % 1) * 0.3), '#fff', 'center');
  if (state === 'over') {
    const won = result === p, tie = result === null;
    ctx.fillStyle = 'rgba(0,0,0,0.45)'; ctx.fillRect(0, 0, vw, vh);
    const label = mode === 'solo' ? '💀 GAME OVER 💀' : tie ? 'DRAW 🤝' : won ? '🏆 WINNER 🏆' : '💀 DEFEATED 💀';
    if (won) { glow(vw / 2, vh * 0.4, vw * 0.4, [255, 210, 60], 0.5); sparklesScreen(vw / 2, vh * 0.4, vw * 0.3, u); }
    text(label, vw / 2, vh * 0.4, Math.min(u * 2.4, vw / 8), won ? '#ffd23f' : tie ? '#fff' : '#ff6b6b', 'center');
  }
  if (state === 'upgrade' && p.pick) drawUpgrade(p, vw, vh, ox, oy, u);
}

function drawTitle(y, u) {
  glow(W / 2, y, W * 0.35, [255, 120, 220], 0.35);
  ctx.save();
  ctx.translate(W / 2, y);
  ctx.rotate(Math.sin(clock * 3) * 0.03);
  const ts = Math.min(u * 3, W / 10);
  ctx.font = `${ts}px ${FONT}`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  ctx.lineWidth = ts / 5; ctx.strokeStyle = '#2a0a3a'; ctx.strokeText('BRAINROT BLASTERS', 0, 0);
  ctx.fillStyle = LG(0, -ts / 2, 0, ts / 2, [[0, '#fff7b0'], [0.45, '#ffc21a'], [0.55, '#ff8a00'], [1, '#ff3d7a']]);
  ctx.fillText('BRAINROT BLASTERS', 0, 0);
  ctx.restore();
  sparklesScreen(W / 2, y, W * 0.32, u);
  return ts;
}

function skinPicker(i, cx, cy, u) {
  const p = players[i], SK = SKINS[p.skin], S = u * 1.35;
  glow(cx, cy - S, S * 1.7, p.rgb, 0.4);
  ctx.save(); ctx.translate(cx, cy + S * 0.15); ctx.scale(S, S);
  drawHero({ rgb: p.rgb, skin: p.skin, hearts: 1, slide: 0, y: 0, z: 0, shield: false, muzzle: 0, spin: 0 });
  ctx.restore();
  text(`${p.name} · ${p.label}`, cx, cy - S * 3.2, u * 0.7, p.css, 'center');
  text(KINDS[SK.kind].name, cx, cy + S * 0.75, u * 0.6, '#fff', 'center');
  const ab = `${SK.ab.icon} ${SK.ab.name}: ${homeSel ? SK.ab.duel : SK.ab.solo}`;
  text(ab, cx, cy + S * 0.75 + u * 0.85, Math.min(u * 0.48, (homeSel ? W * 0.42 : W * 0.8) / (ab.length * 0.48)), '#ffe27a', 'center');
  button(cx - S * 2.3 - u * 1.2, cy - S * 1.1, u * 2.4, u * 1.5, i ? '◀ ←' : '◀ A', false, () => cycleSkin(i, -1));
  button(cx + S * 2.3 - u * 1.2, cy - S * 1.1, u * 2.4, u * 1.5, i ? '→ ▶' : 'D ▶', false, () => cycleSkin(i, 1));
}

function drawHome() {
  ctx.fillStyle = 'rgba(8,4,24,0.62)';
  ctx.fillRect(0, 0, W, H);
  const u = Math.max(12, Math.min(W, H) * 0.032);
  const ts = drawTitle(H * 0.1, u);
  text('🚀 SPACE RUNNER · SOLO OR 1v1 DUEL 🚀', W / 2, H * 0.1 + ts * 0.75, u * 0.75, '#bfe8ff', 'center');
  const n = KIND_KEYS.length, S = Math.min(W / (n * 2.6), H * 0.055), y0 = H * 0.36;
  KIND_KEYS.forEach((k, i) => {
    const x = W * ((i + 0.5) / n);
    glow(x, y0 - S * 1.3, S * 1.8, KINDS[k].col, 0.4);
    ctx.save(); ctx.translate(x, y0); ctx.scale(S, S); blit(charSprite(k, clock + i * 1.3)); ctx.restore();
    text(KINDS[k].name, x, y0 + u * 0.6, Math.min(u * 0.5, W / (n * 11)), '#ffe14d', 'center');
  });
  const bw = Math.min(W * 0.32, u * 11), bh = u * 2.1, by = H * 0.45;
  button(W / 2 - bw - u * 0.5, by, bw, bh, '🧑‍🚀 SINGLE PLAYER', homeSel === 0, () => { if (homeSel === 0) startGame('solo'); else { homeSel = 0; SFX.click(); } });
  button(W / 2 + u * 0.5, by, bw, bh, '⚔️ 1v1 DUEL', homeSel === 1, () => { if (homeSel === 1) startGame('duel'); else { homeSel = 1; SFX.click(); } });
  text(`🪙 COIN BANK ${save.bank}    🏆 BEST SOLO SCORE ${save.best}`, W / 2, by + bh + u * 1.1, u * 0.65, '#ffe14d', 'center');
  const nx = SKINS.find(s => s.cost > save.bank);
  text(nx ? `🔓 Next character: ${KINDS[nx.kind].name} at ${nx.cost} banked coins` : '🎉 All characters unlocked!', W / 2, by + bh + u * 2.1, u * 0.5, '#cfe', 'center');
  const sy = H * 0.8;
  if (homeSel === 1) { skinPicker(0, W * 0.3, sy, u); skinPicker(1, W * 0.7, sy, u); }
  else skinPicker(0, W / 2, sy, u);
  const help = 'W/S or UP/DOWN: mode  ·  A/D and LEFT/RIGHT: character  ·  SPACE / ENTER or click: start  ·  M: sound';
  text(help, W / 2, H * 0.965, Math.min(u * 0.5, W / (help.length * 0.48)), '#aab', 'center');
}

function drawSummary() {
  ctx.fillStyle = 'rgba(6,4,20,0.86)';
  ctx.fillRect(0, 0, W, H);
  const u = Math.max(12, Math.min(W, H) * 0.03);
  const title = mode === 'duel' ? (result ? `🏆 ${result.name} WINS! 🏆` : '🤝 DRAW') : newBest ? '🏆 NEW BEST RUN! 🏆' : '🚀 RUN COMPLETE';
  glow(W / 2, H * 0.09, W * 0.3, [255, 200, 80], 0.35);
  text(title, W / 2, H * 0.09, Math.min(u * 2, W / 14), '#ffd23f', 'center');
  sparklesScreen(W / 2, H * 0.09, W * 0.25, u);
  const cw = Math.min(active.length === 1 ? W * 0.6 : W * 0.44, u * 18), top = H * 0.15, ph = u * 17.5;
  active.forEach((p, k) => {
    const cx = active.length === 1 ? W / 2 : W * (k ? 0.75 : 0.25);
    const win = mode === 'duel' && result === p;
    if (win) glow(cx, top + ph / 2, cw * 0.7, [255, 210, 60], 0.3);
    rrect(cx - cw / 2, top, cw, ph, u * 0.6, LG(0, top, 0, top + ph, [[0, 'rgba(50,40,100,0.95)'], [1, 'rgba(20,14,44,0.95)']]), win ? '#ffe27a' : 'rgba(255,255,255,0.25)', win ? 3 : 1.5);
    text(mode === 'solo' ? 'YOUR RUN' : p.name, cx, top + u * 1.3, u * 1.1, p.css, 'center');
    text(String(score(p)), cx, top + u * 3.1, u * 2.2, '#fff', 'center');
    text('TOTAL SCORE', cx, top + u * 4.6, u * 0.5, '#aab', 'center');
    const rows = [
      ['📏 Distance', `${Math.floor(p.z)} m`, `+${Math.floor(p.z)}`],
      ['🪙 Coins', `${p.coins} × 10`, `+${p.coins * 10}`],
      ['💀 Brainrots blasted', `${p.kills}`, `+${p.points}`],
      ['🔥 Best combo', `x${p.bestCombo}`, ''],
      ['🪐 Planets visited', `${p.seen.size}`, ''],
      ['☠️ Bosses defeated', `${p.bossKills}`, ''],
    ];
    const lx = cx - cw / 2 + u, rx = cx + cw / 2 - u, fs = Math.min(u * 0.7, cw / 24);
    rows.forEach((r, i) => {
      const y = top + u * 6 + i * u * 1.3;
      text(r[0], lx, y, fs, '#e4e0f0');
      text(r[1], cx + cw * 0.18, y, fs, '#fff', 'right');
      if (r[2]) text(r[2], rx, y, fs, '#9dffb0', 'right');
    });
    const y2 = top + u * 6 + rows.length * u * 1.3 + u * 0.4;
    const ups = p.upgradesTaken.map(k => UPGRADES[k].icon).join(' ') || '—';
    const routes = p.gatesTaken.map(m => MODS[m].icon).join(' ') || '—';
    text('Upgrades', lx, y2, fs, '#e4e0f0'); text(ups, rx, y2, fs, '#fff', 'right');
    text('Routes', lx, y2 + u * 1.3, fs, '#e4e0f0'); text(routes, rx, y2 + u * 1.3, fs, '#fff', 'right');
  });
  text(`🪙 +${banked} coins banked · bank total ${save.bank}`, W / 2, H * 0.81, u * 0.75, '#ffe14d', 'center');
  if (newUnlocks.length) text(`🎉 NEW SKIN UNLOCKED: ${newUnlocks.join(', ')}`, W / 2, H * 0.81 + u * 1.2, u * 0.75, '#9dffb0', 'center');
  button(W / 2 - u * 5, H * 0.88, u * 10, u * 2, 'CONTINUE ▶', true, goHome);
  text('SPACE / ENTER', W / 2, H * 0.88 + u * 2.6, u * 0.5, '#aab', 'center');
}

function render() {
  uiRects = [];
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  if (state === 'home') { drawView(players[0], W, H); drawHome(); return; }
  const duel = active.length === 2, sideBySide = W >= H;
  const vps = !duel ? [[0, 0, W, H]] : sideBySide ? [[0, 0, W / 2, H], [W / 2, 0, W / 2, H]] : [[0, 0, W, H / 2], [0, H / 2, W, H / 2]];
  active.forEach((p, i) => {
    const [x, y, w, h] = vps[i];
    const sh = p.shake > 0 ? (Math.random() - 0.5) * p.shake * 30 : 0;
    ctx.save();
    ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
    ctx.translate(x + sh, y + sh);
    drawView(p, w, h);
    ctx.translate(-sh, -sh);
    if (state !== 'summary') drawHUD(p, w, h, x, y);
    ctx.restore();
  });
  if (duel) {
    ctx.fillStyle = LG(0, 0, sideBySide ? 0 : W, sideBySide ? H : 0, [[0, '#ff5fd2'], [0.5, '#ffd23f'], [1, '#3de8ff']]);
    if (sideBySide) ctx.fillRect(W / 2 - 2, 0, 4, H); else ctx.fillRect(0, H / 2 - 2, W, 4);
  }
  if (state === 'summary') drawSummary();
  if (muted) text('🔇 MUTED (M)', W / 2, H - 14, 12, '#aaa', 'center');
}

let last = performance.now(), emaDt = 16.7, emaWork = 6, lastAdj = 0;
function frame(now) {
  const raw = now - last, dt = Math.min(0.05, raw / 1000);
  last = now;
  const t0 = performance.now();
  if (state === 'home') warmCache(3);
  update(dt);
  render();
  const work = performance.now() - t0;
  if (raw < 100) { emaDt += (raw - emaDt) * 0.05; emaWork += (work - emaWork) * 0.05; }
  if (now - lastAdj > 1500 && document.visibilityState === 'visible') {
    if (emaDt > 21 && RS > 0.6) { RS = Math.max(0.6, RS - 0.15); resize(); lastAdj = now; }
    else if (emaDt < 17.8 && emaWork < 7 && RS < MAX_RS) { RS = Math.min(MAX_RS, RS + 0.1); resize(); lastAdj = now; }
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
