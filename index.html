<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Brainrot Blasters 1v1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  html, body { margin: 0; height: 100%; background: #000; color: #fff; color-scheme: dark; overflow: hidden; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; touch-action: none; }
  canvas { display: block; width: 100%; height: 100%; }
</style>

<body>
<canvas id="c"></canvas>
<script>
"use strict";
// ---------------------------------------------------------------------------
// Brainrot Blasters 1v1 — split-screen space runner duel.
// Run a neon highway through space, blast meme creatures with your nonstop
// blaster, smash rocks and crates, dodge freighters and laser gates.
// Every 10 coins sends a brainrot squad at your rival. Planets change as
// you go. Lose all 3 hearts and you lose.
// ---------------------------------------------------------------------------

const cv = document.getElementById('c');
const mainCtx = cv.getContext('2d');
let ctx = mainCtx;
let W = 0, H = 0;
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = cv.clientWidth || innerWidth; H = cv.clientHeight || innerHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
addEventListener('resize', resize);
resize();

// ---- constants -------------------------------------------------------------
const LANE_W = 2.2, CHUNK = 60, VIEW = 120, NEAR = 0.6;
const CAM_H = 4.8, CAM_D = 5.5, CRE_S = 1.45;
const GRAVITY = 30, JUMP_V = 10, STAND_H = 1.75, SLIDE_H = 0.8;
const START_SPEED = 14, MAX_SPEED = 32, ACCEL = 0.25;
const COINS_PER_ATTACK = 10, STAGE_LEN = 700;
const BULLET_V = 130, BULLET_RANGE = 42;
const PI = Math.PI;

const STAGES = [
  { name: 'LUNA STATION',   fog: [70, 72, 110],  sky: [5, 6, 22],  track: [70, 76, 104],  neon: [120, 225, 255], deco: [80, 88, 125],  planet: { c: [205, 205, 215], d: [95, 95, 115] }, craters: true },
  { name: 'MARS CANYON',    fog: [150, 64, 45],  sky: [24, 5, 8],  track: [112, 58, 46],  neon: [255, 150, 60],  deco: [140, 75, 58],  planet: { c: [235, 115, 60], d: [120, 35, 22] }, craters: true },
  { name: 'SATURN RINGWAY', fog: [135, 108, 70], sky: [16, 11, 7], track: [96, 82, 62],   neon: [255, 220, 120], deco: [130, 108, 78], planet: { c: [238, 205, 145], d: [150, 112, 65] }, bands: true, ring: true },
  { name: 'NEPTUNE DEEP',   fog: [36, 72, 155],  sky: [3, 8, 32],  track: [42, 62, 115],  neon: [90, 175, 255],  deco: [48, 78, 145],  planet: { c: [85, 145, 255], d: [18, 45, 150] }, bands: true },
  { name: 'TOXIC ZORB-9',   fog: [52, 112, 50],  sky: [4, 18, 6],  track: [50, 82, 52],   neon: [150, 255, 90],  deco: [58, 105, 60],  planet: { c: [145, 235, 80], d: [35, 105, 30] }, craters: true },
  { name: 'CANDY NEBULA',   fog: [155, 62, 135], sky: [26, 5, 32], track: [112, 62, 112], neon: [255, 130, 230], deco: [150, 75, 145], planet: { c: [255, 155, 215], d: [165, 55, 140] }, bands: true, ring: true },
  { name: 'BLACK HOLE',     fog: [42, 18, 48],   sky: [2, 0, 6],   track: [52, 40, 62],   neon: [255, 110, 40],  deco: [68, 48, 82],   planet: { c: [10, 5, 15], d: [0, 0, 0] }, hole: true },
];

const KINDS = {
  tung:      { name: 'TUNG TUNG TUNG SAHUR', say: 'Tung tung tung tung tung tung tung tung tung sahur!', kill: 'SAHUR!!', hp: 6, h: 2.4, k: 0.4, pts: 60, col: [197, 139, 82], draw: drawTung },
  ballerina: { name: 'BALLERINA CAPPUCCINA', say: 'Ballerina Cappuccina, mi mi mi!', kill: 'MI MI MI!', hp: 4, h: 2.3, k: 0.35, pts: 50, col: [255, 143, 200], draw: drawBallerina },
  assassino: { name: 'CAPPUCCINO ASSASSINO', say: 'Cappuccino Assassino!', kill: 'ASSASSINATO!', hp: 5, h: 2.0, k: 0.65, pts: 70, col: [120, 70, 40], draw: drawAssassino },
  tralalero: { name: 'TRALALERO TRALALA',    say: 'Tralalero tralala!', kill: 'TRALALA!', hp: 9, h: 2.5, k: 0.3, pts: 90, col: [74, 134, 232], draw: drawTralalero },
  bombardino: { name: 'BOMBARDINO CROCODILO', say: 'Bombardino Crocodilo!', kill: 'KABOOMBARDINO!', hp: 7, h: 2.6, k: 0.5, pts: 80, col: [90, 170, 60], draw: drawBombardinoFront },
  lirili:    { name: 'LIRILÌ LARILÀ',        say: 'Lirilì Larilà!', kill: 'TIME STOP!', hp: 10, h: 2.7, k: 0.25, pts: 100, col: [80, 170, 80], draw: drawLirili },
};
const KIND_KEYS = ['tung', 'ballerina', 'assassino', 'tralalero', 'bombardino', 'lirili'];
const KIND_W = [0.24, 0.18, 0.18, 0.12, 0.14, 0.14];

const POWERS = {
  rapid:  { label: 'ESPRESSO', desc: 'rapid fire', col: '#ffa63d', icon: 'E', w: 0.3 },
  triple: { label: 'TRIPLE',   desc: 'triple shot', col: '#3de8ff', icon: '3', w: 0.25 },
  shield: { label: 'SHIELD',   desc: 'blocks a hit', col: '#5d8bff', icon: 'S', w: 0.22 },
  magnet: { label: 'MAGNET',   desc: 'coin magnet', col: '#ff4f5e', icon: 'M', w: 0.15 },
  heart:  { label: '+1 HEART', desc: 'extra life', col: '#ff5fa8', icon: '♥', w: 0.08 },
};
const POWER_KEYS = Object.keys(POWERS);
const DECO_KINDS = ['crystal', 'island', 'mushroom', 'bubble', 'asteroid'];
const DECO_W = [0.28, 0.2, 0.2, 0.14, 0.18];
const SHOUTS = ['💀💀💀', '🔥 BOMBASTICO 🔥', 'MAMMA MIA!', 'BOMBASTICO!', 'BRR BRR PATAPIM!', 'LA VACA SATURNO!', 'ESPRESSO MACHINE!', 'TRALALA!', 'MAMMA MIA PIZZERIA!'];

// ---- helpers ---------------------------------------------------------------
function rngFor(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rgb = a => `rgb(${a[0] | 0},${a[1] | 0},${a[2] | 0})`;
const rgba = (a, al) => `rgba(${a[0] | 0},${a[1] | 0},${a[2] | 0},${al})`;
let FOG = STAGES[0].fog;
function mix(c, k, fog) {
  const r = Math.min(255, c[0] * k), g = Math.min(255, c[1] * k), b = Math.min(255, c[2] * k);
  return `rgb(${(r + (FOG[0] - r) * fog) | 0},${(g + (FOG[1] - g) * fog) | 0},${(b + (FOG[2] - b) * fog) | 0})`;
}
function pick(r, keys, weights) {
  let x = r();
  for (let i = 0; i < keys.length; i++) { x -= weights[i]; if (x <= 0) return keys[i]; }
  return keys[keys.length - 1];
}

function palette(z) {
  const i = Math.max(0, Math.floor(z / STAGE_LEN)), N = STAGES.length;
  const into = z - i * STAGE_LEN;
  const cur = STAGES[i % N], prev = STAGES[(i - 1 + N) % N];
  const b = i === 0 ? 1 : clamp(into / 90, 0, 1);
  const L = key => prev[key].map((v, k) => v + (cur[key][k] - v) * b);
  return { i, cur, prev, b, prog: into / STAGE_LEN, fog: L('fog'), sky: L('sky'), track: L('track'), neon: L('neon'), deco: L('deco') };
}

// ---- audio -----------------------------------------------------------------
let actx = null, muted = false, lastSpeak = 0;
function audioInit() {
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
  } catch (e) { actx = null; }
}
function tone(freq, dur, type = 'sine', gain = 0.05, slide = 0, delay = 0) {
  if (!actx || muted) return;
  try {
    const t = actx.currentTime + delay;
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq * slide), t + dur);
    g.gain.setValueAtTime(gain, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(actx.destination);
    o.start(t); o.stop(t + dur + 0.02);
  } catch (e) {}
}
function noise(dur, gain) {
  if (!actx || muted) return;
  try {
    const n = Math.floor(actx.sampleRate * dur);
    const buf = actx.createBuffer(1, n, actx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n) ** 2;
    const src = actx.createBufferSource(), f = actx.createBiquadFilter(), g = actx.createGain();
    src.buffer = buf; f.type = 'lowpass'; f.frequency.value = 900; g.gain.value = gain;
    src.connect(f).connect(g).connect(actx.destination);
    src.start();
  } catch (e) {}
}
const SFX = {
  shoot: () => tone(1400, 0.04, 'square', 0.006, 0.35),
  coin: () => { tone(990, 0.06, 'square', 0.025); tone(1480, 0.09, 'square', 0.025, 0, 0.05); },
  boom: () => noise(0.35, 0.25),
  bigboom: () => { noise(0.7, 0.4); tone(90, 0.5, 'sine', 0.2, 0.4); },
  hurt: () => tone(220, 0.35, 'sawtooth', 0.08, 0.35),
  power: () => [523, 659, 784, 1046].forEach((f, i) => tone(f, 0.12, 'triangle', 0.06, 0, i * 0.06)),
  tung: () => [0, 0.14, 0.28].forEach(d => tone(170, 0.1, 'triangle', 0.18, 0.6, d)),
  hit: () => tone(300, 0.05, 'triangle', 0.02, 0.5),
};
function speak(txt, force) {
  if (muted || !window.speechSynthesis) return;
  const now = performance.now();
  if (!force && now - lastSpeak < 2600) return;
  lastSpeak = now;
  try {
    const u = new SpeechSynthesisUtterance(txt);
    u.lang = 'it-IT'; u.rate = 1.08; u.pitch = 0.7 + Math.random() * 0.9; u.volume = 0.9;
    speechSynthesis.cancel();
    speechSynthesis.speak(u);
  } catch (e) {}
}

// ---- world generation (shared by both players) ------------------------------
let seed = 1;
const chunks = new Map();

function makeObs(type, lane, z, id) {
  switch (type) {
    case 'freighter': return { type, lane, z, len: 7, y0: 0, h: 2.7, id, solid: true };
    case 'rock':      return { type, lane, z, len: 0.6, y0: 0, h: 1.0, id, hpMax: 3, breakable: true };
    case 'crate':     return { type, lane, z, len: 1.0, y0: 0, h: 1.1, id, hpMax: 2, breakable: true };
    case 'bomb':      return { type, lane, z, len: 0.8, y0: 0, h: 0.9, id, hpMax: 1, breakable: true, t0: clock };
    default:          return { type: 'laser', lane, z, len: 0.3, y0: 1.15, h: 1.2, id };
  }
}

function getChunk(i) {
  let ch = chunks.get(i);
  if (ch) return ch;
  const r = rngFor(seed * 100003 + i * 7919);
  const obs = [], coins = [], cres = [], pows = [];
  let n = 0;
  if (i > 0) {
    const busy = Math.min(0.85, 0.5 + i * 0.03);
    const rows = [];
    for (let row = 0; row < 3; row++) {
      const z = i * CHUNK + 4 + row * 20 + r() * 4;
      const free = Math.floor(r() * 3) - 1;
      rows.push([z, free]);
      for (let lane = -1; lane <= 1; lane++) {
        if (lane === free || r() > busy) continue;
        const p = r();
        const type = p < 0.3 ? 'freighter' : p < 0.55 ? 'rock' : p < 0.75 ? 'laser' : 'crate';
        obs.push(makeObs(type, lane, z, `${i}o${n++}`));
        if ((type === 'rock' || type === 'crate') && r() < 0.5)
          for (let c = 0; c < 3; c++) coins.push({ lane, z: z - 1.6 + c * 1.6, y: 2.1, id: `${i}k${n++}` });
      }
      if (r() < 0.75)
        for (let c = 0; c < 5; c++) coins.push({ lane: free, z: z - 13 + c * 1.6, y: 0.9, id: `${i}k${n++}` });
    }
    if (i >= 2) {
      let count = 1 + (r() < 0.4 + Math.min(0.4, i * 0.03) ? 1 : 0) + (i > 10 && r() < 0.4 ? 1 : 0);
      for (let k = 0; k < count; k++)
        cres.push({ cre: true, kind: pick(r, KIND_KEYS, KIND_W), lane: Math.floor(r() * 3) - 1, z0: i * CHUNK + 10 + r() * 45, id: `${i}c${k}` });
    }
    if (r() < 0.4) {
      const [z, free] = rows[1];
      pows.push({ kind: pick(r, POWER_KEYS, POWER_KEYS.map(k => POWERS[k].w)), lane: free, z: z - 3, y: 1.1, id: `${i}p` });
    }
  }
  const deco = [];
  for (const side of [-1, 1]) {
    for (let k = 0; k < 5; k++) {
      const kind = pick(r, DECO_KINDS, DECO_W);
      const s = kind === 'island' ? 2 + r() * 2.5 : kind === 'bubble' ? 0.8 + r() * 1.6 : 1.4 + r() * 2.2;
      const verts = []; for (let v = 0; v < 9; v++) verts.push(0.75 + r() * 0.35);
      const shards = []; for (let v = 0; v < 5; v++) shards.push(0.9 + r() * 1.4);
      deco.push({ kind, s, x: side * (5.8 + s + r() * 9), y: kind === 'mushroom' || kind === 'crystal' ? -1.5 + r() * 4 : -1 + r() * 9,
        z: i * CHUNK + k * 12 + r() * 10, verts, shards, spin: (r() - 0.5) * 1.5, ph: r() * 10, hue: r() < 0.5 ? 0 : 1 });
    }
  }
  ch = { obs, coins, cres, pows, deco };
  chunks.set(i, ch);
  return ch;
}

function chunksIn(z0, z1) {
  const out = [];
  for (let i = Math.max(0, Math.floor(z0 / CHUNK)); i <= Math.floor(z1 / CHUNK); i++) out.push(getChunk(i));
  return out;
}

// creatures walk toward the runner once it gets within 70 units
function crePos(c, p) {
  const K = KINDS[c.kind];
  const z = c.z0 - K.k * Math.max(0, p.z - (c.z0 - 70));
  let x = c.lane * LANE_W;
  if (c.kind === 'ballerina') x += Math.sin(clock * 2.5 + c.z0) * 0.45;
  return [x, z];
}

// ---- players ---------------------------------------------------------------
const players = [
  { name: 'P1', rgb: [60, 170, 255], css: '#3caaff', keys: { left: 'KeyA', right: 'KeyD', jump: 'KeyW', slide: 'KeyS' }, label: 'W A S D' },
  { name: 'P2', rgb: [255, 80, 130], css: '#ff5082', keys: { left: 'ArrowLeft', right: 'ArrowRight', jump: 'ArrowUp', slide: 'ArrowDown' }, label: 'Arrow keys' },
];

function resetPlayer(p) {
  Object.assign(p, {
    lane: 0, x: 0, camX: 0, y: 0, vy: 0, slide: 0, z: 0,
    hearts: 3, inv: 0, coins: 0, meter: 0, shake: 0, points: 0, kills: 0, combo: 0, comboT: 0,
    fireT: 0, jam: 0, shots: 0, muzzle: 0, rapid: 0, triple: 0, magnet: 0, shield: false, stage: 0, flyby: -1,
    collected: new Set(), hit: new Set(), dead: new Set(), shout: new Set(), hp: new Map(), flash: new Map(),
    extra: [], bullets: [], parts: [], floats: [], msgs: [], T: [],
  });
}
players.forEach(resetPlayer);

let state = 'menu';     // menu | countdown | play | over
let countdown = 0, gameT = 0, speed = 0, spawnN = 0, result = null, nextBomb = 20, clock = 0;

function startGame() {
  audioInit();
  seed = (Math.random() * 1e9) | 0;
  chunks.clear();
  players.forEach(resetPlayer);
  gameT = 0; speed = 0; spawnN = 0; result = null; nextBomb = 20;
  countdown = 3; state = 'countdown';
}

function say(p, text, color) { p.msgs.push({ text, color, t: 1.5 }); if (p.msgs.length > 2) p.msgs.shift(); }
function float(p, x, y, z, text, color) { p.floats.push({ x, y, dz: z - p.z, text, color, life: 1.1 }); }
function burst(p, x, y, z, col, n, power = 6) {
  for (let i = 0; i < n; i++)
    p.parts.push({ x, y, z, vx: (Math.random() - 0.5) * power, vy: Math.random() * power, vz: (Math.random() - 0.3) * power, life: 0.5 + Math.random() * 0.5, col });
}

function act(p, action) {
  if (state !== 'play' || p.hearts <= 0) return;
  if (action === 'left' && p.lane > -1) p.lane--;
  else if (action === 'right' && p.lane < 1) p.lane++;
  else if (action === 'jump' && p.y < 0.05) { p.vy = JUMP_V; p.slide = 0; }
  else if (action === 'slide') { p.slide = 0.65; if (p.y > 0.05) p.vy = -18; }
}

function addCoins(p, n) {
  p.coins += n; p.meter += n;
  while (p.meter >= COINS_PER_ATTACK) { p.meter -= COINS_PER_ATTACK; attack(p, players[1 - players.indexOf(p)]); }
}

function attack(from, to) {
  if (to.hearts <= 0) return;
  const lanes = [to.lane, [-1, 0, 1].filter(l => l !== to.lane)[Math.floor(Math.random() * 2)]];
  lanes.forEach((lane, k) => to.extra.push({
    cre: true, attack: true, kind: KIND_KEYS[Math.floor(Math.random() * KIND_KEYS.length)], lane, z0: to.z + 80 + k * 7, id: 'a' + spawnN++,
  }));
  say(from, 'BRAINROT SQUAD SENT!', '#d9a6ff');
  say(to, 'INCOMING BRAINROT!', '#d9a6ff');
}

function gather(p) {
  const T = [];
  const add = o => {
    if (p.dead.has(o.id)) return;
    if (o.cre) {
      const [x, z] = crePos(o, p), K = KINDS[o.kind];
      T.push({ o, x, z: z - 0.4, len: 0.8, y0: 0, h: K.h * 1.2, hpMax: K.hp, breakable: true, cre: true });
    } else {
      T.push({ o, x: o.lane * LANE_W, z: o.z, len: o.len, y0: o.y0, h: o.h, hpMax: o.hpMax, breakable: !!o.breakable, solid: !!o.solid, laser: o.type === 'laser' });
    }
  };
  for (const ch of chunksIn(p.z - 12, p.z + 140)) { ch.obs.forEach(add); ch.cres.forEach(add); }
  p.extra.forEach(add);
  return T;
}

function destroy(p, t, byGun) {
  const id = t.o.id;
  p.dead.add(id);
  const cz = t.z + t.len / 2;
  if (t.cre) {
    const K = KINDS[t.o.kind];
    burst(p, t.x, 1.2, cz, K.col, 26, 9);
    burst(p, t.x, 1.2, cz, [255, 255, 255], 8, 7);
    if (!byGun) return;
    p.kills++;
    p.combo = p.comboT > 0 ? p.combo + 1 : 1;
    p.comboT = 2.5;
    const pts = K.pts * p.combo;
    p.points += pts;
    float(p, t.x, K.h * CRE_S, cz, `+${pts}`, '#ffe14d');
    if (t.o.kind === 'lirili') {
      const opp = players[1 - players.indexOf(p)];
      if (opp.hearts > 0) { opp.jam = 3.5; say(opp, '⏰ LIRILÌ JAMMED YOUR BLASTER!', '#9dffb0'); }
      say(p, '⏰ TIME STOP! RIVAL JAMMED', '#9dffb0');
      speak('Lirilì Larilà!', true);
    }
    if (p.combo >= 3) say(p, `🔥 COMBO x${p.combo}! ${SHOUTS[Math.floor(Math.random() * SHOUTS.length)]}`, '#ffd23f');
    if (t.o.kind === 'tung') SFX.tung();
    SFX.boom();
  } else if (t.o.type === 'crate') {
    burst(p, t.x, 0.6, cz, [210, 150, 70], 18);
    addCoins(p, 3);
    float(p, t.x, 1.6, cz, '+3 ●', '#ffd23f');
    SFX.boom(); SFX.coin();
  } else if (t.o.type === 'bomb') {
    burst(p, t.x, 0.5, cz, [255, 150, 40], 30, 12);
    burst(p, t.x, 0.5, cz, [255, 240, 120], 12, 8);
    p.points += 25;
    float(p, t.x, 1.4, cz, '+25 KABOOM', '#ffae3d');
    SFX.bigboom();
  } else {
    burst(p, t.x, 0.5, cz, [150, 140, 135], 18);
    p.points += 10;
    float(p, t.x, 1.4, cz, '+10', '#ddd');
    SFX.boom();
  }
}

function damage(p, t) {
  const id = t.o.id;
  const hp = (p.hp.has(id) ? p.hp.get(id) : t.hpMax) - 1;
  p.hp.set(id, hp);
  p.flash.set(id, clock);
  burst(p, t.x, 1, t.z, [255, 230, 150], 2, 4);
  if (hp <= 0) destroy(p, t, true);
}

function fire(p, sliding) {
  const by = p.y + (sliding ? 0.45 : 1.05);
  const xs = p.triple > 0 ? [p.x - LANE_W, p.x, p.x + LANE_W] : [p.x + 0.3];
  for (const x of xs) p.bullets.push({ x, y: by, z: p.z + 1.0 });
  p.muzzle = 0.05;
  if (p.shots++ % 3 === 0) SFX.shoot();
}

function updatePlayer(p, i, dt) {
  p.z += speed * dt;
  p.x += (p.lane * LANE_W - p.x) * Math.min(1, dt * 15);
  p.vy -= GRAVITY * dt;
  p.y += p.vy * dt;
  if (p.y < 0) { p.y = 0; p.vy = 0; }
  p.slide -= dt; p.inv -= dt; p.muzzle -= dt;
  p.rapid = Math.max(0, p.rapid - dt); p.triple = Math.max(0, p.triple - dt); p.magnet = Math.max(0, p.magnet - dt);
  p.comboT -= dt; if (p.comboT <= 0) p.combo = 0;
  const sliding = p.slide > 0 && p.y < 0.05;
  const height = sliding ? SLIDE_H : STAND_H;

  p.extra = p.extra.filter(o => (o.cre ? crePos(o, p)[1] : o.z + o.len) > p.z - 10);
  const T = p.T = gather(p);

  // nonstop blaster
  p.fireT -= dt; p.jam -= dt;
  if (p.jam > 0) p.fireT = Math.max(p.fireT, 0);
  else while (p.fireT <= 0) { p.fireT += p.rapid > 0 ? 0.065 : 0.14; fire(p, sliding); }
  for (const b of p.bullets) {
    const nz = b.z + BULLET_V * dt;
    let hit = null, best = 1e9;
    for (const t of T) {
      if (t.laser || (!t.breakable && !t.solid) || p.dead.has(t.o.id)) continue;
      if (Math.abs(t.x - b.x) > 1.0 || b.y < t.y0 || b.y > t.y0 + t.h) continue;
      const z0 = t.z - 0.3, z1 = t.z + t.len + 0.3;
      if (nz < z0 || b.z > z1) continue;
      if (z0 < best) { best = z0; hit = t; }
    }
    if (hit) {
      b.dead = true;
      if (hit.solid) burst(p, b.x, b.y, hit.z, [255, 230, 150], 3, 4);
      else damage(p, hit);
    }
    b.z = nz;
    if (b.z > p.z + BULLET_RANGE) b.dead = true;
  }
  p.bullets = p.bullets.filter(b => !b.dead);

  // collisions with the runner
  for (const t of T) {
    const id = t.o.id;
    if (p.dead.has(id) || p.hit.has(id)) continue;
    if (Math.abs(t.x - p.x) > 1.2) continue;
    if (p.z + 0.35 < t.z || p.z - 0.35 > t.z + t.len) continue;
    if (p.y >= t.y0 + t.h || p.y + height <= t.y0) continue;
    p.hit.add(id);
    if (t.cre || t.o.type === 'bomb') destroy(p, t, false);
    if (p.inv > 0) continue;
    if (p.shield) {
      p.shield = false; p.inv = 0.8;
      if (t.breakable && !p.dead.has(id)) destroy(p, t, false);
      say(p, 'SHIELD SAVED YOU!', '#8fb4ff');
      SFX.hit();
      continue;
    }
    p.hearts--; p.inv = 1.6; p.shake = 0.4;
    SFX.hurt();
    say(p, p.hearts > 0 ? (t.cre ? `${KINDS[t.o.kind].name} GOT YOU!` : 'OUCH!') : '💀 WASTED 💀', '#ff6b6b');
  }

  // coins & power-ups
  const near = chunksIn(p.z - 4, p.z + 6);
  const mag = p.magnet > 0;
  for (const ch of near) {
    for (const c of ch.coins) {
      if (p.collected.has(c.id)) continue;
      const dx = Math.abs(c.lane * LANE_W - p.x), dz = Math.abs(c.z - p.z);
      if (mag ? (dx < 3.6 && dz < 2.5) : (dx < 1 && dz < 0.8 && Math.abs(c.y - (p.y + height / 2)) < 1.3)) {
        p.collected.add(c.id);
        addCoins(p, 1);
        if (p.coins % 2) SFX.coin();
      }
    }
    for (const w of ch.pows) {
      if (p.collected.has(w.id)) continue;
      if (Math.abs(w.lane * LANE_W - p.x) < 1.1 && Math.abs(w.z - p.z) < 0.9 && Math.abs(w.y - (p.y + height / 2)) < 1.4) {
        p.collected.add(w.id);
        if (w.kind === 'rapid') p.rapid = 8;
        else if (w.kind === 'triple') p.triple = 8;
        else if (w.kind === 'magnet') p.magnet = 10;
        else if (w.kind === 'shield') p.shield = true;
        else p.hearts = Math.min(3, p.hearts + 1);
        say(p, `${POWERS[w.kind].label}!`, POWERS[w.kind].col);
        SFX.power();
      }
    }
  }

  // creatures shout their names when they get close
  for (const t of T) {
    if (!t.cre || p.shout.has(t.o.id) || t.z - p.z > 45 || t.z < p.z) continue;
    p.shout.add(t.o.id);
    speak(KINDS[t.o.kind].say);
    if (t.o.kind === 'tung' && i === 0) SFX.tung();
  }

  // new planet
  const si = Math.floor(p.z / STAGE_LEN);
  if (si > p.stage) {
    p.stage = si;
    say(p, `PLANET ${si + 1}: ${STAGES[si % STAGES.length].name}`, rgb(STAGES[si % STAGES.length].neon));
    if (i === 0) speak(`Benvenuti a ${STAGES[si % STAGES.length].name.toLowerCase()}!`, true);
  }
}

const score = p => Math.floor(p.z) + p.coins * 10 + p.points;

function update(dt) {
  clock += dt;
  if (state === 'countdown') {
    countdown -= dt;
    if (countdown <= 0) { state = 'play'; speed = START_SPEED; players.forEach(p => say(p, 'GO!', '#fff')); }
  } else if (state === 'play') {
    gameT += dt;
    speed = Math.min(MAX_SPEED, START_SPEED + gameT * ACCEL);
    players.forEach((p, i) => updatePlayer(p, i, dt));
    if (gameT >= nextBomb) {
      nextBomb = gameT + 22 + Math.random() * 10;
      const lanes = [0, 1, 2].map(() => Math.floor(Math.random() * 3) - 1);
      players.forEach(p => {
        if (p.hearts <= 0) return;
        p.flyby = 0;
        lanes.forEach((l, k) => p.extra.push(makeObs('bomb', l, p.z + 50 + k * 14, 'b' + spawnN++)));
        say(p, '✈️ BOMBARDINO CROCODILO! 💣', '#9dff7a');
      });
      speak('Bombardino Crocodilo!', true);
    }
    const dead = players.filter(p => p.hearts <= 0);
    if (dead.length) {
      state = 'over';
      if (dead.length === 2) {
        const [a, b] = players.map(score);
        result = a === b ? null : players[a > b ? 0 : 1];
      } else result = players.find(p => p.hearts > 0);
      speak(result ? `Player ${players.indexOf(result) + 1} vince! Bombastico!` : 'Pareggio! Mamma mia!', true);
    }
  }
  for (const p of players) {
    if (state !== 'play') p.T = gather(p);
    p.shake = Math.max(0, p.shake - dt);
    p.camX += (p.x * 0.7 - p.camX) * Math.min(1, dt * 8);
    if (p.flyby >= 0) { p.flyby += dt; if (p.flyby > 3.5) p.flyby = -1; }
    p.msgs.forEach(m => m.t -= dt);
    p.msgs = p.msgs.filter(m => m.t > 0);
    for (const q of p.parts) { q.x += q.vx * dt; q.y += q.vy * dt; q.z += q.vz * dt + speed * dt * 0.3; q.vy -= 12 * dt; q.life -= dt; }
    p.parts = p.parts.filter(q => q.life > 0);
    for (const f of p.floats) { f.life -= dt; f.y += dt * 1.5; f.dz -= speed * dt * 0.6; }
    p.floats = p.floats.filter(f => f.life > 0);
  }
}

// ---- input -----------------------------------------------------------------
addEventListener('keydown', e => {
  if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Space'].includes(e.code)) e.preventDefault();
  if (e.repeat) return;
  if (e.code === 'KeyM') { muted = !muted; if (muted && window.speechSynthesis) speechSynthesis.cancel(); return; }
  if ((e.code === 'Space' || e.code === 'Enter') && (state === 'menu' || state === 'over')) { startGame(); return; }
  for (const p of players) for (const [action, code] of Object.entries(p.keys)) if (code === e.code) act(p, action);
});
addEventListener('mousedown', () => { window.focus(); if (state === 'menu' || state === 'over') startGame(); });

const touches = new Map();
addEventListener('touchstart', e => {
  e.preventDefault();
  for (const t of e.changedTouches) touches.set(t.identifier, { x: t.clientX, y: t.clientY });
}, { passive: false });
addEventListener('touchend', e => {
  e.preventDefault();
  for (const t of e.changedTouches) {
    const s = touches.get(t.identifier); touches.delete(t.identifier);
    if (!s) continue;
    if (state === 'menu' || state === 'over') { startGame(); return; }
    const side = W >= H ? (s.x < W / 2 ? 0 : 1) : (s.y < H / 2 ? 0 : 1);
    const dx = t.clientX - s.x, dy = t.clientY - s.y;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) act(players[side], 'jump');
    else if (Math.abs(dx) > Math.abs(dy)) act(players[side], dx < 0 ? 'left' : 'right');
    else act(players[side], dy < 0 ? 'jump' : 'slide');
  }
}, { passive: false });


// ---- 3D-ish rendering ------------------------------------------------------
let cam = null, PAL = palette(0), FLASH = false;
const FONT = "'Anton', Impact, 'Arial Narrow Bold', 'Arial Black', sans-serif";
function proj(x, y, z) {
  const s = cam.f / (z - cam.z);
  return [cam.cx + (x - cam.x) * s, cam.hor + (cam.y - y) * s, s];
}
function quad(pts, fill) {
  ctx.fillStyle = fill;
  ctx.beginPath();
  for (let i = 0; i < pts.length; i++) {
    const q = proj(pts[i][0], pts[i][1], pts[i][2]);
    if (i) ctx.lineTo(q[0], q[1]); else ctx.moveTo(q[0], q[1]);
  }
  ctx.closePath();
  ctx.fill();
}
const fogAt = z => clamp((z - cam.z - 35) / (VIEW - 35), 0, 1);

function box(x, y, z, w, h, d, c, extra) {
  const zn = cam.z + NEAR;
  if (z + d < zn) return;
  const z0 = Math.max(z, zn), z1 = z + d;
  const fg = fogAt(z0);
  if (fg >= 1) return;
  const l = x - w / 2, r = x + w / 2, t = y + h;
  if (cam.x < l) quad([[l, y, z0], [l, y, z1], [l, t, z1], [l, t, z0]], mix(c, 0.55, fg));
  if (cam.x > r) quad([[r, y, z0], [r, y, z1], [r, t, z1], [r, t, z0]], mix(c, 0.55, fg));
  if (cam.y > t) quad([[l, t, z0], [r, t, z0], [r, t, z1], [l, t, z1]], mix(c, 1.25, fg));
  quad([[l, y, z0], [r, y, z0], [r, t, z0], [l, t, z0]], mix(c, 0.95, fg));
  if (extra && z >= zn) extra(l, r, y, t, z0, fg);
}

// draws fn in a local space where 1 unit = 1 world unit, origin at (x,y,z), up = negative y
function billboard(x, y, z, fn) {
  if (z < cam.z + NEAR + 0.3) return null;
  const fg = fogAt(z);
  if (fg >= 1) return null;
  const q = proj(x, y, z);
  ctx.save();
  ctx.globalAlpha = 1 - fg;
  ctx.translate(q[0], q[1]);
  ctx.scale(q[2], q[2]);
  fn(q[2]);
  ctx.restore();
  return q;
}

// ---- glossy "AI render" drawing kit ----------------------------------------
const shd = (c, k) => rgb(c.map(v => clamp(v * k, 0, 255)));
const lit = (c, a) => rgb(c.map(v => v + (255 - v) * a));
function LG(x0, y0, x1, y1, stops) { const g = ctx.createLinearGradient(x0, y0, x1, y1); stops.forEach(s => g.addColorStop(s[0], s[1])); return g; }
function RG(x, y, r, stops, fx = x, fy = y) { const g = ctx.createRadialGradient(fx, fy, 0, x, y, Math.max(1e-4, r)); stops.forEach(s => g.addColorStop(s[0], s[1])); return g; }
function shape(pts, fill, stroke, lw) {
  ctx.beginPath();
  pts.forEach((q, i) => i ? ctx.lineTo(q[0], q[1]) : ctx.moveTo(q[0], q[1]));
  ctx.closePath();
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw || 0.04; ctx.stroke(); }
}
function ell(x, y, rx, ry, fill, stroke, lw, rot = 0) {
  ctx.beginPath();
  ctx.ellipse(x, y, Math.abs(rx), Math.abs(ry), rot, 0, PI * 2);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw || 0.04; ctx.stroke(); }
}
function ln(x1, y1, x2, y2, col, lw) {
  ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
}
function rrect(x, y, w, h, r, fill, stroke, lw) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw || 0.04; ctx.stroke(); }
}
// glossy sphere / ellipse with a key light from the upper left
function orb(x, y, rx, ry, c, rot = 0) {
  const r = Math.max(rx, ry);
  ell(x, y, rx, ry, RG(x, y, r * 1.05, [[0, lit(c, 0.65)], [0.35, rgb(c)], [1, shd(c, 0.3)]], x - rx * 0.35, y - ry * 0.45), null, 0, rot);
}
function specular(x, y, rx, ry, a = 0.8) {
  ell(x, y, rx, ry, RG(x, y, Math.max(rx, ry), [[0, `rgba(255,255,255,${a})`], [1, 'rgba(255,255,255,0)']]));
}
// additive glow, drawn from cached pre-rendered sprites (much faster than live gradients)
const glowCache = new Map();
function glowSprite(c, a) {
  const q = v => Math.round(v / 12) * 12;
  const key = `${q(c[0])},${q(c[1])},${q(c[2])},${Math.round(a * 10)}`;
  let cv2 = glowCache.get(key);
  if (!cv2) {
    cv2 = document.createElement('canvas'); cv2.width = cv2.height = 64;
    const g2 = cv2.getContext('2d');
    const col = [q(c[0]), q(c[1]), q(c[2])], al = Math.round(a * 10) / 10;
    const gr = g2.createRadialGradient(32, 32, 0, 32, 32, 32);
    gr.addColorStop(0, rgba(col, al)); gr.addColorStop(0.4, rgba(col, al * 0.45)); gr.addColorStop(1, rgba(col, 0));
    g2.fillStyle = gr; g2.fillRect(0, 0, 64, 64);
    glowCache.set(key, cv2);
  }
  return cv2;
}
function glow(x, y, r, c, a = 0.6) {
  if (!(r > 0)) return;
  const o = ctx.globalCompositeOperation;
  ctx.globalCompositeOperation = 'lighter';
  ctx.drawImage(glowSprite(c, Math.min(1, a)), x - r, y - r, r * 2, r * 2);
  ctx.globalCompositeOperation = o;
}
// vertical cylinder-shaded rounded rect
function cyl(x, y, w, h, r, c) {
  rrect(x, y, w, h, r, LG(x, 0, x + w, 0, [[0, shd(c, 0.4)], [0.3, lit(c, 0.4)], [0.55, rgb(c)], [1, shd(c, 0.35)]]));
}
// thick shaded limb
function limb(x1, y1, x2, y2, w, c) {
  ln(x1, y1, x2, y2, shd(c, 0.5), w);
  ln(x1 - w * 0.1, y1, x2 - w * 0.1, y2, rgb(c), w * 0.72);
  ln(x1 - w * 0.22, y1, x2 - w * 0.22, y2, lit(c, 0.45), w * 0.22);
}
function eye(x, y, r, iris = [100, 60, 25], lx = 0, slit = false) {
  ell(x, y, r, r * 1.05, RG(x, y, r, [[0, '#ffffff'], [0.7, '#f1f1f5'], [1, '#a9a9b8']], x - r * 0.3, y - r * 0.3));
  orb(x + lx, y + r * 0.1, r * 0.56, r * 0.6, iris);
  if (slit) ell(x + lx, y + r * 0.1, r * 0.1, r * 0.45, '#050505');
  else ell(x + lx, y + r * 0.12, r * 0.28, r * 0.3, '#050505');
  ell(x + lx - r * 0.2, y - r * 0.12, r * 0.15, r * 0.15, '#fff');
  ell(x + lx + r * 0.16, y + r * 0.28, r * 0.06, r * 0.06, 'rgba(255,255,255,0.85)');

function star4(x, y, r, col) {
  ctx.fillStyle = col;
  ctx.beginPath();
  ctx.moveTo(x, y - r);
  ctx.quadraticCurveTo(x, y, x + r, y); ctx.quadraticCurveTo(x, y, x, y + r);
  ctx.quadraticCurveTo(x, y, x - r, y); ctx.quadraticCurveTo(x, y, x, y - r);

}
function sparkles(t, n, rx, cy, ry, r) {
  for (let k = 0; k < n; k++) {
    const a = t * 0.8 + k * 2.4, tw = Math.sin(t * 4 + k * 1.7);
    if (tw < 0.2) continue;
    star4(Math.cos(a) * rx, cy + Math.sin(a * 1.3) * ry, r * tw, 'rgba(255,255,235,0.95)');

}
function heartPath(x, y, s) {
  ctx.beginPath();
  ctx.moveTo(x, y + s * 0.3);
  ctx.bezierCurveTo(x, y, x - s * 0.5, y, x - s * 0.5, y + s * 0.3);
  ctx.bezierCurveTo(x - s * 0.5, y + s * 0.6, x, y + s * 0.8, x, y + s);
  ctx.bezierCurveTo(x, y + s * 0.8, x + s * 0.5, y + s * 0.6, x + s * 0.5, y + s * 0.3);
  ctx.bezierCurveTo(x + s * 0.5, y, x, y, x, y + s * 0.3);
}
function softShadow(rx) { ell(0, 0, rx, rx * 0.28, RG(0, 0, rx, [[0, 'rgba(0,0,0,0.45)'], [1, 'rgba(0,0,0,0)']])); }

function drawAstro(p) {
  const suit = [236, 240, 250], acc = p.rgb;

function drawPlanet(st, vw, vh, prog, alpha) {
  if (alpha <= 0.01) return;
  const R = Math.min(vw, vh) * (0.08 + 0.15 * prog), cx = vw * 0.72, cy = Math.max(R * 1.2, vh * 0.2);
  const P = st.planet;
  ctx.save();
  ctx.globalAlpha = alpha;
  // god rays
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.translate(cx, cy);
  ctx.rotate(clock * 0.05);
  const rayCol = st.hole ? [255, 150, 70] : P.c;
  for (let k = 0; k < 12; k++) {
    ctx.rotate(PI * 2 / 12);
    const len = Math.max(vw, vh) * (0.9 + 0.3 * Math.sin(k * 3.1 + clock * 0.7));
    ctx.fillStyle = LG(0, 0, len, 0, [[0, rgba(rayCol, 0.16)], [1, rgba(rayCol, 0)]]);
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(len, -len * 0.05); ctx.lineTo(len, len * 0.05); ctx.fill();
  }
  ctx.restore();
  if (st.hole) {
    glow(cx, cy, R * 2.8, [255, 140, 60], 0.6);
    const disk = (a0, a1) => {
      ctx.lineWidth = R * 0.3; ctx.strokeStyle = 'rgba(255,150,60,0.9)';
      ctx.beginPath(); ctx.ellipse(cx, cy, R * 1.9, R * 0.42, -0.2, a0, a1); ctx.stroke();
      ctx.lineWidth = R * 0.09; ctx.strokeStyle = 'rgba(255,240,200,0.95)';
      ctx.beginPath(); ctx.ellipse(cx, cy, R * 1.55, R * 0.33, -0.2, a0, a1); ctx.stroke();
    };
    disk(PI, PI * 2);
    ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(cx, cy, R, 0, PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(255,210,150,0.9)'; ctx.lineWidth = R * 0.06; ctx.stroke();
    disk(0, PI);
  } else {
    const ring = (a0, a1) => {
      ctx.lineWidth = R * 0.24; ctx.strokeStyle = rgba(P.c.map(v => Math.min(255, v + 40)), 0.8);
      ctx.beginPath(); ctx.ellipse(cx, cy, R * 2.0, R * 0.48, -0.3, a0, a1); ctx.stroke();
      ctx.lineWidth = R * 0.07; ctx.strokeStyle = rgba(P.d, 0.6);
      ctx.beginPath(); ctx.ellipse(cx, cy, R * 1.7, R * 0.4, -0.3, a0, a1); ctx.stroke();
    };
    if (st.ring) ring(PI, PI * 2);
    glow(cx, cy, R * 1.7, P.c, 0.55);
    ctx.fillStyle = RG(cx, cy, R, [[0, rgb(P.c.map(v => Math.min(255, v + 60)))], [0.5, rgb(P.c)], [1, rgb(P.d)]], cx - R * 0.4, cy - R * 0.4);
    ctx.beginPath(); ctx.arc(cx, cy, R, 0, PI * 2); ctx.fill();
    ctx.save();
    ctx.clip();
    if (st.bands) for (let k = 0; k < 7; k++) {
      ctx.fillStyle = rgba(k % 2 ? P.d : P.c.map(v => Math.min(255, v + 40)), 0.3);
      ctx.beginPath(); ctx.ellipse(cx, cy - R + k * R * 0.31 + R * 0.1, R * 1.2, R * 0.065, 0, 0, PI * 2); ctx.fill();
    }
    if (st.craters) for (const c of CRATERS) {
      ctx.fillStyle = rgba(P.d, 0.35);
      ctx.beginPath(); ctx.arc(cx + Math.cos(c.a) * c.r * R, cy + Math.sin(c.a) * c.r * R, c.s * R, 0, PI * 2); ctx.fill();
    }
    ctx.fillStyle = RG(cx - R * 0.3, cy - R * 0.3, R * 1.7, [[0, 'rgba(0,0,0,0)'], [0.45, 'rgba(0,0,0,0)'], [1, 'rgba(0,0,0,0.7)']]);
    ctx.fillRect(cx - R, cy - R, R * 2, R * 2);
    ctx.restore();
    ctx.strokeStyle = rgba(P.c.map(v => Math.min(255, v + 80)), 0.7); ctx.lineWidth = Math.max(1, R * 0.03);
    ctx.beginPath(); ctx.arc(cx, cy, R, PI * 0.9, PI * 1.6); ctx.stroke();
    if (st.ring) ring(0, PI);
  }
  // lens flare toward the screen center
  const dx = vw / 2 - cx, dy = vh * 0.55 - cy;
  [[0.35, 0.18, P.c], [0.6, 0.08, PAL.neon], [0.85, 0.12, alt(PAL.neon)], [1.25, 0.25, P.c]].forEach(([k, s, c]) =>
    glow(cx + dx * k, cy + dy * k, R * s * 2, c, 0.18));
  ctx.restore();
}

// the sky (gradient, nebulae, planet, god rays) is rendered at half resolution ~10x/s and cached
function drawSpace(p, vw, vh) {
  const sc = 0.5, w = Math.max(1, Math.ceil(vw * sc)), h = Math.max(1, Math.ceil(vh * sc));
  if (!p.bg) p.bg = document.createElement('canvas');
  if (p.bg.width !== w || p.bg.height !== h) { p.bg.width = w; p.bg.height = h; p.bgT = -9; }
  if (clock - p.bgT > 0.1 || clock < p.bgT) {
    p.bgT = clock;
    const keep = ctx;
    ctx = p.bg.getContext('2d');
    ctx.setTransform(sc, 0, 0, sc, 0, 0);
    drawSky(vw, vh);
    ctx = keep;
  }
  ctx.drawImage(p.bg, 0, 0, vw, vh);
  ctx.fillStyle = '#fff';
  for (const s of STARS) {
    const x = (((s.u * vw - p.camX * 6 * s.d) % vw) + vw) % vw, y = s.v * vh;
    const a = s.b * (0.6 + 0.4 * Math.sin(clock * s.tw + s.u * 50)) * clamp(Math.abs(y - cam.hor) / (vh * 0.12), 0, 1);
    ctx.globalAlpha = a;
    if (s.sp) star4(x, y, 3 + 3 * Math.sin(clock * s.tw * 2 + s.v * 30) ** 2, '#fff');
    else ctx.fillRect(x, y, s.s, s.s);
  }
  ctx.globalAlpha = 1;
  if (p.flyby >= 0) {
    const k = p.flyby / 3.5, S = Math.min(vw, vh) * 0.1;
    const x = vw * (1.2 - k * 1.45), y = vh * 0.16 + Math.sin(p.flyby * 4) * vh * 0.02;
    ctx.save(); ctx.translate(x, y); ctx.scale(S, S); drawBombardinoSide(clock); ctx.restore();
  }
}

function drawSky(vw, vh) {
  ctx.fillStyle = LG(0, 0, 0, vh, [[0, rgb(PAL.sky)], [clamp(cam.hor / vh, 0.01, 0.99), rgb(PAL.fog)], [1, rgb(PAL.sky)]]);
  ctx.fillRect(0, 0, vw, vh);
  // dreamy nebula clouds
  const n2 = alt(PAL.neon), n3 = [255, 90, 210];
  for (const [u, v, r, c, a] of [[0.2, 0.2, 0.6, PAL.neon, 0.22], [0.85, 0.35, 0.5, n2, 0.2], [0.5, 0.05, 0.45, n3, 0.16], [0.1, 0.6, 0.4, n3, 0.12], [0.9, 0.7, 0.45, PAL.neon, 0.12]])
    glow(vw * (u + Math.sin(clock * 0.1 + u * 9) * 0.03), vh * v, vw * r, c, a);
  if (PAL.b < 1) drawPlanet(PAL.prev, vw, vh, 1, 1 - PAL.b);
  drawPlanet(PAL.cur, vw, vh, PAL.prog, PAL.b);
}

function drawDeco(d) {
  const nc = d.hue ? alt(PAL.neon) : PAL.neon, s = d.s, t = clock + d.ph;
  billboard(d.x, d.y + Math.sin(t * 0.8) * 0.3, d.z, () => {
    if (d.kind === 'crystal') {
      glow(0, -s * 0.3, s * 1.4, nc, 0.35);
      const n = 3 + (d.verts.length % 3);
      for (let k = 0; k < n; k++) {
        const h = s * d.shards[k], a = (k - (n - 1) / 2) * 0.32, w = s * 0.2;
        ctx.save(); ctx.rotate(a);
        shape([[-w, 0], [-w, -h * 0.75], [0, -h], [w, -h * 0.75], [w, 0], [0, w * 0.6]],
          LG(-w, 0, w, 0, [[0, shd(nc, 0.35)], [0.45, lit(nc, 0.5)], [0.52, '#ffffff'], [1, rgb(nc)]]));
        ctx.restore();
      }
      if (Math.sin(t * 3) > 0.7) star4(0, -s * 1.2, s * 0.25, '#fff');
    } else if (d.kind === 'island') {
      glow(0, 0, s * 1.6, nc, 0.2);
      shape([[-s, 0], [s, 0], [s * 0.5, s * 0.5], [s * 0.15, s * 1.2], [-s * 0.4, s * 0.6]], LG(0, 0, 0, s * 1.2, [[0, '#8a6a5a'], [1, '#2a1a20']]));
      ctx.fillStyle = LG(0, 0, 0, s * 2, [[0, 'rgba(190,240,255,0.85)'], [1, 'rgba(190,240,255,0)']]);
      ctx.fillRect(s * 0.5, -0.02, s * 0.14, s * 2);
      ell(0, 0, s, s * 0.22, LG(0, -s * 0.22, 0, s * 0.22, [[0, lit(nc, 0.5)], [1, shd(nc, 0.5)]]));
      for (const [tx, th, tc] of [[-0.5, 0.9, [255, 120, 200]], [0.1, 1.2, nc], [0.55, 0.7, [255, 220, 120]]]) {
        ln(tx * s, -0.05 * s, tx * s, -th * s * 0.6, '#5a3a2a', s * 0.06);
        orb(tx * s, -th * s * 0.7, s * 0.22, s * 0.2, tc);
      }
    } else if (d.kind === 'mushroom') {
      glow(0, -s * 1.1, s * 1.5, nc, 0.35);
      cyl(-s * 0.14, -s * 1.1, s * 0.28, s * 1.1, s * 0.1, [240, 235, 225]);
      ctx.beginPath(); ctx.ellipse(0, -s * 1.05, s * 0.7, s * 0.5, 0, PI, PI * 2); ctx.closePath();
      ctx.fillStyle = RG(0, -s * 1.05, s * 0.75, [[0, lit(nc, 0.7)], [0.4, rgb(nc)], [1, shd(nc, 0.35)]], -s * 0.25, -s * 1.4); ctx.fill();
      for (const [sx, sy, sr] of [[-0.35, -1.2, 0.09], [0.1, -1.4, 0.11], [0.4, -1.15, 0.07], [-0.1, -1.18, 0.06]]) ell(sx * s, sy * s, sr * s, sr * s * 0.8, 'rgba(255,255,255,0.9)');
    } else if (d.kind === 'bubble') {
      ell(0, 0, s, s, RG(0, 0, s, [[0, 'rgba(255,255,255,0.02)'], [0.8, rgba(nc, 0.12)], [1, rgba(nc, 0.35)]]));
      ctx.lineWidth = s * 0.06;
      ctx.strokeStyle = LG(-s, -s, s, s, [[0, 'rgba(255,90,200,0.7)'], [0.33, 'rgba(255,230,90,0.7)'], [0.66, 'rgba(90,240,255,0.7)'], [1, 'rgba(160,110,255,0.7)']]);
      ctx.beginPath(); ctx.arc(0, 0, s, 0, PI * 2); ctx.stroke();
      specular(-s * 0.4, -s * 0.45, s * 0.25, s * 0.15, 0.9);
    } else {
      ctx.rotate(t * d.spin);
      ctx.beginPath();
      d.verts.forEach((v, k) => { const an = k / d.verts.length * PI * 2; const px = Math.cos(an) * v * s, py = Math.sin(an) * v * s; k ? ctx.lineTo(px, py) : ctx.moveTo(px, py); });
      ctx.closePath();
      ctx.fillStyle = RG(0, 0, s, [[0, '#a89cb0'], [0.6, '#5a4e66'], [1, '#221a2a']], -s * 0.35, -s * 0.35); ctx.fill();
      ell(s * 0.25, s * 0.1, s * 0.2, s * 0.15, 'rgba(0,0,0,0.3)');
      ctx.strokeStyle = rgba(nc, 0.6); ctx.lineWidth = s * 0.04; ctx.stroke();
    }
  });
}

function drawTrack(vw, vh) {
  const zn = cam.z + NEAR, zf = cam.z + VIEW, half = LANE_W * 1.5 + 0.35;
  const T = PAL.track, N = PAL.neon;
  quad([[-half, 0, zn], [half, 0, zn], [half, 0, zf], [-half, 0, zf]],
    LG(0, cam.hor, 0, vh, [[0, rgb(PAL.fog)], [0.12, shd(T, 0.55)], [0.6, rgb(T)], [1, lit(T, 0.2)]]));
  ctx.fillStyle = 'rgba(255,255,255,0.05)';
  for (let z = Math.ceil(zn / 4) * 4; z < cam.z + 80; z += 4) {
    if (Math.floor(z / 4) % 2) continue;
    quad([[-half, 0, z], [half, 0, z], [half, 0, z + 2], [-half, 0, z + 2]], 'rgba(255,255,255,0.05)');
  }
  ctx.globalCompositeOperation = 'lighter';
  // glossy reflection of the sky light
  quad([[-half * 0.8, 0, zn], [half * 0.8, 0, zn], [half * 0.2, 0, zf], [-half * 0.2, 0, zf]],
    LG(0, cam.hor, 0, vh, [[0, rgba(PAL.cur.planet.c, 0.1)], [0.5, rgba(N, 0.03)], [1, rgba(N, 0.08)]]));
  for (let z = Math.ceil(zn / 6) * 6; z < cam.z + 70; z += 6)
    for (let lane = -1; lane <= 1; lane++) {
      const x = lane * LANE_W;
      quad([[x - 0.22, 0.01, z], [x + 0.22, 0.01, z], [x, 0.01, z + 1.3]], rgba(N, 0.4 * (1 - fogAt(z))));
    }
  for (const x of [-LANE_W / 2, LANE_W / 2]) {
    quad([[x - 0.2, 0.01, zn], [x + 0.2, 0.01, zn], [x + 0.2, 0.01, zf], [x - 0.2, 0.01, zf]], rgba(N, 0.12));
    quad([[x - 0.04, 0.01, zn], [x + 0.04, 0.01, zn], [x + 0.04, 0.01, zf], [x - 0.04, 0.01, zf]], rgba(N, 0.6));
  }
  for (const s of [-1, 1]) {
    const x = s * half;
    quad([[x - 0.7, 0.02, zn], [x + 0.7, 0.02, zn], [x + 0.7, 0.02, zf], [x - 0.7, 0.02, zf]], rgba(N, 0.18));
    quad([[x - 0.15, 0.02, zn], [x + 0.15, 0.02, zn], [x + 0.15, 0.02, zf], [x - 0.15, 0.02, zf]], rgba(N, 0.9));
    quad([[x - 0.04, 0.03, zn], [x + 0.04, 0.03, zn], [x + 0.04, 0.03, zf], [x - 0.04, 0.03, zf]], 'rgba(255,255,255,0.8)');
  }
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = LG(0, cam.hor - 2, 0, cam.hor + vh * 0.05, [[0, rgba(PAL.fog, 1)], [1, rgba(PAL.fog, 0)]]);
  ctx.fillRect(0, cam.hor - 2, vw, vh * 0.05 + 2);
}

const FREIGHT_NAMES = ['TUNG EXPRESS', 'CAPPUCCINO CARGO', 'BRR BRR FREIGHT', 'LA VACA LINES', 'TRALALA TRANSIT', 'PATAPIM POST'];

function drawTarget(p, t) {
  const o = t.o;
  FLASH = clock - (p.flash.get(o.id) ?? -9) < 0.07;
  if (t.cre) {
    const K = KINDS[o.kind];
    const q = billboard(t.x, 0, t.z + 0.4, () => {
      if (o.attack) { glow(0, -1.2, 1.6, [180, 80, 255], 0.5); ell(0, 0, 0.9, 0.25, 'rgba(190,90,255,0.55)'); }
      ctx.scale(CRE_S, CRE_S);
      ctx.save();
      K.draw(clock + o.z0);
      ctx.restore();
      if (FLASH) glow(0, -K.h * 0.5, 1.3, [255, 255, 255], 0.9);
    });
    if (q && p.hp.has(o.id) && t.z - p.z < 55 && t.z > p.z - 1) {
      const top = proj(t.x, K.h * CRE_S + 0.3, t.z + 0.4);
      const fs = clamp(q[2] * 0.34, 10, 24);
      if (p.hp.has(o.id)) {
        const bw = q[2] * 1.3, frac = p.hp.get(o.id) / K.hp, bh = Math.max(3, fs * 0.25);
        ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(top[0] - bw / 2, top[1] + fs * 0.7, bw, bh);
        ctx.fillStyle = LG(top[0] - bw / 2, 0, top[0] + bw / 2, 0, [[0, '#ff3a3a'], [0.5, '#ffe14d'], [1, '#5dff6a']]);
        ctx.fillRect(top[0] - bw / 2, top[1] + fs * 0.7, bw * frac, bh);
      }
    }
  } else if (o.type === 'freighter') {
    const c = PAL.deco.map(v => v * 0.4 + 90);
    const ghost = o.z < p.z + 1 && Math.abs(t.x - p.x) < 1.6; // runner is inside/next to it: see-through
    if (ghost) ctx.globalAlpha = 0.3;
    box(t.x, 0, o.z, 2.0, o.h, o.len, c, (l, r, y, top, z0, fg) => {
      const a = proj(l, top, z0 - 0.01), b = proj(r, y, z0 - 0.01), w = b[0] - a[0], h = b[1] - a[1];
      ctx.save();
      ctx.globalAlpha = 1 - fg;
      rrect(a[0], a[1], w, h, w * 0.08, LG(a[0], 0, b[0], 0, [[0, '#4a5060'], [0.3, '#dfe4ee'], [0.55, '#9aa2b4'], [1, '#3a404e']]));
      rrect(a[0] + w * 0.1, a[1] + h * 0.1, w * 0.8, h * 0.2, w * 0.04, LG(0, a[1], 0, a[1] + h * 0.3, [[0, rgba(PAL.neon, 0.9)], [1, '#101826']]));
      specular(a[0] + w * 0.3, a[1] + h * 0.15, w * 0.15, h * 0.04, 0.8);
      for (let k = 0; k < 8; k++) {
        ctx.fillStyle = k % 2 ? '#1a1a1a' : '#ffc928';
        ctx.fillRect(a[0] + k * w / 8, a[1] + h * 0.8, w / 8 + 0.5, h * 0.1);
      }
      for (const lx of [0.22, 0.78]) { glow(a[0] + w * lx, a[1] + h * 0.6, w * 0.22, PAL.neon, 0.9); ell(a[0] + w * lx, a[1] + h * 0.6, w * 0.06, w * 0.06, '#fff'); }
      const nm = FREIGHT_NAMES[Math.abs(Math.floor(o.z * 7)) % FREIGHT_NAMES.length];
      text(nm, a[0] + w / 2, a[1] + h * 0.44, Math.max(6, Math.min(w / (nm.length * 0.5), h * 0.09)), '#ffffff', 'center');
      ctx.restore();
    });
    ctx.globalAlpha = 1;
  } else if (o.type === 'laser') {
    for (const sd of [-1, 1]) billboard(t.x + sd * 1.0, 0, o.z, () => {
      cyl(-0.1, -(o.y0 + o.h + 0.15), 0.2, o.y0 + o.h + 0.15, 0.08, [150, 156, 176]);
      orb(0, -(o.y0 + o.h + 0.15), 0.14, 0.14, [255, 60, 90]);
      glow(0, -(o.y0 + o.h + 0.15), 0.45, [255, 60, 90], 0.7);
    });
    if (o.z < cam.z + NEAR) return;
    const fg = fogAt(o.z);
    const a = proj(t.x - 0.95, o.y0, o.z), b = proj(t.x + 0.95, o.y0 + o.h, o.z);
    const fl = 0.75 + 0.25 * Math.sin(clock * 30);
    ctx.save();
    ctx.globalAlpha = (1 - fg) * fl;
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = LG(0, b[1], 0, a[1], [[0, 'rgba(255,40,90,0.05)'], [0.5, 'rgba(255,40,90,0.4)'], [1, 'rgba(255,40,90,0.05)']]);
    ctx.fillRect(a[0], b[1], b[0] - a[0], a[1] - b[1]);
    for (let k = 1; k <= 3; k++) {
      const yy = b[1] + (a[1] - b[1]) * k / 4, th = Math.max(2, a[2] * 0.06);
      ctx.fillStyle = 'rgba(255,80,120,0.6)'; ctx.fillRect(a[0], yy - th * 2, b[0] - a[0], th * 4);
      ctx.fillStyle = '#fff0f4'; ctx.fillRect(a[0], yy - th / 2, b[0] - a[0], th);
    }
    ctx.restore();
  } else if (o.type === 'crate') {
    billboard(t.x, 0, o.z + 0.5, () => {
      const s = 0.65, h = 1.15;
      glow(0, -h / 2, 1.3, [255, 200, 60], 0.45);
      shape([[-s, -h], [s, -h], [s * 0.78, -h - 0.22], [-s * 0.78, -h - 0.22]], LG(0, -h - 0.22, 0, -h, [[0, '#fff6c0'], [1, '#f2c040']]));
      rrect(-s, -h, 2 * s, h, 0.06, LG(0, -h, 0, 0, [[0, '#ffe788'], [0.5, '#f0a81a'], [1, '#8a5206']]), '#fff3b0', 0.03);
      glow(0, -h / 2, 0.5, [255, 255, 210], 0.7);
      text('?', 0, -h / 2, 0.85, '#ffffff', 'center');
      specular(-0.35, -h + 0.18, 0.18, 0.06, 0.9);
      if (Math.sin(clock * 5 + o.z) > 0.6) star4(s * 0.8, -h, 0.18, '#fff');
      if (FLASH) glow(0, -h / 2, 1.2, [255, 255, 255], 0.9);
    });
  } else if (o.type === 'bomb') {
    const drop = clamp((o.t0 + 1.0 - clock) * 12, 0, 14);
    billboard(t.x, drop, o.z + 0.4, () => {
      softShadow(0.45);
      orb(0, -0.45, 0.45, 0.45, [38, 36, 50]);
      specular(-0.15, -0.62, 0.14, 0.09, 0.8);
      rrect(-0.08, -0.95, 0.16, 0.1, 0.02, '#6a6a76');
      ln(0.02, -0.95, 0.2, -1.12, '#c0905a', 0.05);
      glow(0.22, -1.14, 0.25 + Math.random() * 0.1, [255, 180, 60], 0.9);
      star4(0.22, -1.14, 0.12, '#fff');
      if (Math.sin(clock * 8) > 0) glow(0, -0.45, 0.25, [255, 40, 40], 0.9);
      if (FLASH) glow(0, -0.45, 0.8, [255, 255, 255], 0.9);
    });
  } else { // magma rock
    billboard(t.x, 0, o.z + 0.3, () => {
      softShadow(0.9);
      ctx.beginPath();
      for (let k = 0; k < 10; k++) {
        const a = k / 10 * PI * 2, rr = 0.85 + 0.15 * Math.sin(k * 2.7 + o.z);
        const px = Math.cos(a) * 0.95 * rr, py = -0.5 + Math.sin(a) * 0.55 * rr;
        k ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
      }
      ctx.closePath();
      ctx.fillStyle = RG(0, -0.5, 1, [[0, '#8c7c92'], [0.6, '#4a3e54'], [1, '#1c1424']], -0.3, -0.8); ctx.fill();
      const pulse = 0.6 + 0.4 * Math.sin(clock * 4 + o.z);
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.strokeStyle = `rgba(255,140,40,${pulse})`; ctx.lineWidth = 0.05; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(-0.6, -0.4); ctx.lineTo(-0.2, -0.55); ctx.lineTo(0.1, -0.35); ctx.lineTo(0.55, -0.6);
      ctx.moveTo(-0.2, -0.55); ctx.lineTo(-0.1, -0.85); ctx.stroke();
      ctx.restore();
      glow(-0.1, -0.5, 0.6, [255, 120, 30], 0.3 * pulse);
      specular(-0.35, -0.82, 0.3, 0.07, 0.4);
      if (FLASH) glow(0, -0.5, 1.1, [255, 255, 255], 0.9);
    });
  }
  FLASH = false;
}

function drawCoin(c) {
  billboard(c.lane * LANE_W, c.y, c.z, () => {
    const sx = Math.max(0.15, Math.abs(Math.cos(clock * 4 + c.z)));
    glow(0, 0, 0.7, [255, 200, 50], 0.4);
    ell(0, 0, 0.36 * sx, 0.36, LG(-0.36 * sx, -0.36, 0.36 * sx, 0.36, [[0, '#fff3a0'], [0.5, '#ffbf1a'], [1, '#a06a00']]));
    ell(0, 0, 0.24 * sx, 0.24, LG(0.24 * sx, 0.24, -0.24 * sx, -0.24, [[0, '#fff3a0'], [0.5, '#ffcc33'], [1, '#c08000']]));
    specular(-0.1 * sx, -0.14, 0.1 * sx, 0.06, 0.9);
    if (Math.sin(clock * 3 + c.z * 2) > 0.85) star4(0.2 * sx, -0.25, 0.2, '#fff');
  });
}

function drawPower(w) {
  const P = POWERS[w.kind], col = [parseInt(P.col.slice(1, 3), 16), parseInt(P.col.slice(3, 5), 16), parseInt(P.col.slice(5, 7), 16)];
  const q = billboard(w.lane * LANE_W, w.y + Math.sin(clock * 3 + w.z) * 0.15, w.z, () => {
    glow(0, 0, 1.0, col, 0.7);
    orb(0, 0, 0.45, 0.45, col);
    ctx.strokeStyle = 'rgba(255,255,255,0.8)'; ctx.lineWidth = 0.04;
    ctx.beginPath(); ctx.ellipse(0, 0, 0.7, 0.2, clock * 2, 0, PI * 2); ctx.stroke();
    specular(-0.15, -0.2, 0.15, 0.1, 0.9);
    text(P.icon, 0, 0.02, 0.5, '#fff', 'center');
  });
  if (q && w.z - cam.z < 30) text(P.label, q[0], q[1] - q[2] * 0.8, clamp(q[2] * 0.18, 8, 12), P.col, 'center');
}

function drawView(p, vw, vh) {
  PAL = palette(p.z); FOG = PAL.fog;
  const f = Math.min(vw * 0.8, vh * 0.95);
  cam = { x: p.camX, y: CAM_H + p.y * 0.45, z: p.z - CAM_D, f, cx: vw / 2, hor: Math.max(vh * 0.12, vh * 0.84 - CAM_H * f / CAM_D) };
  drawSpace(p, vw, vh);

  const items = [];
  for (const ch of chunksIn(cam.z, cam.z + VIEW)) {
    for (const d of ch.deco) items.push({ z: d.z, d: () => drawDeco(d) });
    for (const c of ch.coins) if (!p.collected.has(c.id)) items.push({ z: c.z, d: () => drawCoin(c) });
    for (const w of ch.pows) if (!p.collected.has(w.id)) items.push({ z: w.z, d: () => drawPower(w) });
  }
  for (const t of p.T) if (t.z + t.len > cam.z && t.z < cam.z + VIEW) items.push({ z: t.z, d: () => drawTarget(p, t) });
  for (const b of p.bullets) items.push({ z: b.z, d: () => {
    if (b.z < cam.z + NEAR) return;
    const a = proj(b.x, b.y, b.z), e = proj(b.x, b.y, b.z + 1.8);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(e[0], e[1]);
    ctx.strokeStyle = rgba(p.rgb, 0.35); ctx.lineWidth = Math.max(4, a[2] * 0.4); ctx.stroke();
    ctx.strokeStyle = rgba(p.rgb, 0.9); ctx.lineWidth = Math.max(2, a[2] * 0.14); ctx.stroke();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = Math.max(1, a[2] * 0.05); ctx.stroke();
    ctx.restore();
  } });
  for (const q of p.parts) items.push({ z: q.z, d: () => {
    if (q.z < cam.z + NEAR) return;
    const s = proj(q.x, q.y, q.z), sz = clamp(0.2 * s[2], 2, 12);
    ctx.globalAlpha = clamp(q.life * 2, 0, 1);
    glow(s[0], s[1], sz * 1.6, q.col, 0.9);
    ctx.globalAlpha = 1;
  } });
  items.push({ z: p.z - 0.3, d: () => billboard(p.x, p.y, p.z, () => {
    if (p.inv > 0 && Math.floor(p.inv * 12) % 2) return;
    drawAstro(p);
  }) });
  items.sort((a, b) => b.z - a.z);
  drawTrack(vw, vh);
  // runner's shadow on the track
  const sp = proj(p.x, 0, p.z);
  ell(sp[0], sp[1], 0.55 * sp[2], 0.18 * sp[2], RG(sp[0], sp[1], 0.55 * sp[2], [[0, 'rgba(0,0,0,0.5)'], [1, 'rgba(0,0,0,0)']]));
  for (const it of items) it.d();

  for (const fl of p.floats) {
    const z = p.z + fl.dz;
    if (z < cam.z + NEAR + 1) continue;
    const q = proj(fl.x, fl.y, z);
    ctx.globalAlpha = clamp(fl.life * 2, 0, 1);
    text(fl.text, q[0], q[1], clamp(q[2] * 0.2, 10, 16), fl.color, 'center');
    ctx.globalAlpha = 1;
  }
  // vignette
  ctx.fillStyle = RG(vw / 2, vh / 2, Math.hypot(vw, vh) * 0.6, [[0, 'rgba(0,0,0,0)'], [0.65, 'rgba(0,0,0,0)'], [1, 'rgba(0,0,0,0.55)']]);
  ctx.fillRect(0, 0, vw, vh);
}

// ---- HUD & screens ---------------------------------------------------------
function heart(x, y, s, filled) {
  heartPath(x, y, s);
  ctx.fillStyle = filled ? LG(x - s / 2, y, x + s / 2, y + s, [[0, '#ff9aae'], [0.5, '#ff2f55'], [1, '#a0102a']]) : 'rgba(255,255,255,0.18)';
  ctx.fill();
  if (filled) specular(x - s * 0.22, y + s * 0.25, s * 0.12, s * 0.08, 0.9);
}

function text(str, x, y, size, color, align = 'left') {
  ctx.font = `${size}px ${FONT}`;
  ctx.textAlign = align; ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round';
  ctx.lineWidth = Math.max(size * 0.02, size / 5.5); ctx.strokeStyle = 'rgba(0,0,0,0.85)';
  ctx.strokeText(str, x, y);
  ctx.fillStyle = color; ctx.fillText(str, x, y);
}

function drawHUD(p, vw, vh) {
  const u = Math.max(13, Math.min(vw, vh) * 0.042);
  rrect(u * 0.6, u * 0.6, u * 2.4, u * 1.4, u * 0.3, LG(0, u * 0.6, 0, u * 2, [[0, lit(p.rgb, 0.4)], [1, shd(p.rgb, 0.6)]]));
  text(p.name, u * 1.8, u * 1.3, u * 1.0, '#fff', 'center');
  for (let i = 0; i < 3; i++) heart(u * 3.9 + i * u * 1.4, u * 0.85, u, i < p.hearts);
  if (p.shield) text('🛡️', u * 3.9 + 3 * u * 1.4, u * 1.3, u, '#8fb4ff', 'center');
  text(String(score(p)), vw - u * 0.7, u * 1.3, u * 1.3, '#fff', 'right');
  text(`💀 KILLS ${p.kills}`, vw - u * 0.7, u * 2.6, u * 0.65, '#ffe14d', 'right');
  if (p.combo >= 2) {
    const pulse = 1 + Math.max(0, p.comboT - 2) * 0.6;
    text(`🔥 COMBO x${p.combo}`, vw - u * 0.7, u * 3.6, u * 0.85 * pulse, '#ffd23f', 'right');
  }
  const mx = u * 0.6, my = u * 2.4, mw = Math.min(vw * 0.45, u * 10), mh = u * 0.62;
  rrect(mx, my, mw, mh, mh / 2, 'rgba(0,0,0,0.5)');
  if (p.meter > 0) rrect(mx, my, Math.max(mh, mw * p.meter / COINS_PER_ATTACK), mh, mh / 2, LG(mx, 0, mx + mw, 0, [[0, '#ff5fd2'], [1, '#8a4dff']]));
  text(`🪙 ${p.coins}   BRAINROT ATTACK ${p.meter}/${COINS_PER_ATTACK}`, mx + 8, my + mh / 2, u * 0.5, '#fff');
  let py = my + mh + u * 0.5;
  const bars = [['rapid', p.rapid, 8], ['triple', p.triple, 8], ['magnet', p.magnet, 10]];
  for (const [key, val, max] of bars) {
    if (val <= 0) continue;
    const P = POWERS[key];
    rrect(mx, py, mw * 0.6, mh * 0.75, mh * 0.35, 'rgba(0,0,0,0.5)');
    rrect(mx, py, Math.max(mh * 0.75, mw * 0.6 * val / max), mh * 0.75, mh * 0.35, P.col);
    text(P.label, mx + 8, py + mh * 0.38, u * 0.45, '#fff');
    py += mh;
  }
  if (p.jam > 0) text(`⏰ BLASTER JAMMED ${p.jam.toFixed(1)}s`, mx, py + mh * 0.5, u * 0.6, '#9dffb0');
  const pal = palette(p.z);
  text(`🪐 PLANET ${pal.i + 1} · ${pal.cur.name}`, u * 0.7, vh - u * 0.9, u * 0.6, rgb(pal.neon));
  p.msgs.forEach((m, k) => {
    ctx.globalAlpha = clamp(m.t * 2, 0, 1);
    const pop = 1 + Math.max(0, m.t - 1.35) * 1.2;
    text(m.text, vw / 2, vh * 0.2 + k * u * 1.05, Math.min(u * 0.78, vw / (m.text.length * 0.6)) * pop, m.color, 'center');
    ctx.globalAlpha = 1;
  });
  if (state === 'countdown') text(String(Math.ceil(countdown)), vw / 2, vh * 0.4, u * 5 * (1 + (countdown % 1) * 0.3), '#fff', 'center');
  if (state === 'over') {
    const won = result === p, tie = result === null;
    ctx.fillStyle = 'rgba(0,0,0,0.45)'; ctx.fillRect(0, 0, vw, vh);
    if (won) { glow(vw / 2, vh * 0.36, vw * 0.4, [255, 210, 60], 0.5); sparklesScreen(vw / 2, vh * 0.36, vw * 0.3, u); }
    text(tie ? 'DRAW 🤝' : won ? '🏆 WINNER 🏆' : '💀 DEFEATED 💀', vw / 2, vh * 0.36, Math.min(u * 2.6, vw / 8), tie ? '#fff' : won ? '#ffd23f' : '#ff6b6b', 'center');
    text(`SCORE ${score(p)}`, vw / 2, vh * 0.36 + u * 2.4, u * 1.1, '#fff', 'center');
    text(`${p.kills} brainrots blasted · ${p.coins} coins · planet ${palette(p.z).i + 1}`, vw / 2, vh * 0.36 + u * 3.6, u * 0.62, '#dde', 'center');
  }
}

function sparklesScreen(cx, cy, r, u) {
  for (let k = 0; k < 10; k++) {
    const a = clock * 0.6 + k * 0.63, tw = Math.sin(clock * 4 + k * 1.3);
    if (tw < 0.1) continue;
    star4(cx + Math.cos(a) * r, cy + Math.sin(a * 1.7) * r * 0.4, u * 0.6 * tw, 'rgba(255,250,220,0.95)');
  }
}

function drawMenu() {
  ctx.fillStyle = 'rgba(8,4,24,0.72)';
  ctx.fillRect(0, 0, W, H);
  const u = Math.max(12, Math.min(W, H) * 0.032);
  glow(W / 2, H * 0.12, W * 0.35, [255, 120, 220], 0.35);
  ctx.save();
  ctx.translate(W / 2, H * 0.11);
  ctx.rotate(Math.sin(clock * 3) * 0.035);
  const ts = Math.min(u * 3, W / 10);
  ctx.font = `${ts}px ${FONT}`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  ctx.lineWidth = ts / 5; ctx.strokeStyle = '#2a0a3a'; ctx.strokeText('BRAINROT BLASTERS', 0, 0);
  ctx.fillStyle = LG(0, -ts / 2, 0, ts / 2, [[0, '#fff7b0'], [0.45, '#ffc21a'], [0.55, '#ff8a00'], [1, '#ff3d7a']]);
  ctx.fillText('BRAINROT BLASTERS', 0, 0);
  ctx.restore();
  sparklesScreen(W / 2, H * 0.11, W * 0.32, u);
  text('🚀 1v1 SPLIT-SCREEN SPACE RUNNER 🚀', W / 2, H * 0.11 + ts * 0.75, u * 0.8, '#bfe8ff', 'center');
  const n = KIND_KEYS.length, S = Math.min(W / (n * 2.4), H * 0.1), y0 = H * 0.5;
  KIND_KEYS.forEach((k, i) => {
    const x = W * ((i + 0.5) / n);
    glow(x, y0 - S * 1.3, S * 1.8, KINDS[k].col, 0.45);
    ctx.save(); ctx.translate(x, y0); ctx.scale(S, S); KINDS[k].draw(clock + i * 1.3); ctx.restore();
    text(KINDS[k].name, x, y0 + u * 0.9, Math.min(u * 0.6, W / (n * 11)), '#ffe14d', 'center');
  });
  const col = (p, x) => {
    text(p.name, x, H * 0.64, u * 1.3, p.css, 'center');
    text(p.label, x, H * 0.64 + u * 1.3, u * 0.75, '#fff', 'center');
  };
  col(players[0], W * 0.3);
  col(players[1], W * 0.7);
  const lines = [
    'Left / Right: switch lane  ·  Up: jump  ·  Down: slide  ·  Your blaster fires nonstop 🔫',
    'Blast brainrots, rocks, crates & bombs  ·  Dodge freighters  ·  Slide under red lasers',
    `Every ${COINS_PER_ATTACK} coins sends a brainrot squad at your rival  ·  Kill Lirilì Larilà to jam their blaster ⏰`,
    '3 hearts each  ·  M = sound',
  ];
  lines.forEach((l, i) => text(l, W / 2, H * 0.76 + i * u * 1.1, Math.min(u * 0.62, W / (l.length * 0.48)), '#e4e0f0', 'center'));
  if (Math.floor(clock * 2) % 2 === 0)
    text('👉 CLICK OR PRESS SPACE TO START 👈', W / 2, H * 0.94, u * 1.0, '#fff', 'center');
}

function render() {
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  const sideBySide = W >= H;
  const vps = sideBySide ? [[0, 0, W / 2, H], [W / 2, 0, W / 2, H]] : [[0, 0, W, H / 2], [0, H / 2, W, H / 2]];
  players.forEach((p, i) => {
    const [x, y, w, h] = vps[i];
    const sh = p.shake > 0 ? (Math.random() - 0.5) * p.shake * 30 : 0;
    ctx.save();
    ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
    ctx.translate(x + sh, y + sh);
    drawView(p, w, h);
    ctx.translate(-sh, -sh);
    if (state !== 'menu') drawHUD(p, w, h);
    ctx.restore();
  });
  ctx.fillStyle = LG(0, 0, sideBySide ? 0 : W, sideBySide ? H : 0, [[0, '#ff5fd2'], [0.5, '#ffd23f'], [1, '#3de8ff']]);
  if (sideBySide) ctx.fillRect(W / 2 - 2, 0, 4, H); else ctx.fillRect(0, H / 2 - 2, W, 4);
  if (state === 'menu') drawMenu();
  if (state === 'over' && Math.floor(clock * 2) % 2 === 0)
    text('👉 CLICK OR PRESS SPACE FOR A REMATCH 👈', W / 2, H * 0.93, Math.max(13, Math.min(W, H) * 0.032), '#fff', 'center');
  if (muted && state !== 'menu') text('🔇 MUTED (M)', W / 2, H - 14, 12, '#aaa', 'center');
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  update(dt);
  render();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
